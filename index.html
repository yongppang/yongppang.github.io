<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<title>소설 관리</title>
<script>(function(){try{var m=localStorage.getItem("novel-theme")||"auto";var d=m==="dark"||(m==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}})()</script>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--card:#fff;--blk:#efecff;--blkbd:#d3cdf6;--tx:#1f2330;--sub:#6a7083;--bd:#dfe2ea;--ac:#6c5ce7;--fs:#e5484d;--paper:#fffdf8;--wf:"Noto Serif KR","Noto Serif CJK KR","Source Han Serif K","Nanum Myeongjo","나눔명조","Batang","바탕","AppleMyungjo",serif;--wsz:17px}
:root[data-wf=sans]{--wf:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#10121a;--card:#1a1d2b;--blk:#232848;--blkbd:#3b427a;--tx:#e9ebf5;--sub:#9ba2bc;--bd:#2d3248;--ac:#8d7fff;--fs:#ff6d73;--paper:#161a28}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.35;cursor:default}
.pl{color:var(--sub);font-size:13px}
.sp{flex:1}
.rolechip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);white-space:nowrap}
.rolechip.adm{background:var(--blk);color:var(--ac);border-color:var(--blkbd)}
.rolechip.usr{background:#e4f7ec;color:#1f7a50;border-color:#b5e3c9}
:root[data-theme=dark] .rolechip.usr{background:#1d3f36;color:#7fe3b8;border-color:#2f8a70}

/* ===== 상단 ===== */
header{display:flex;align-items:center;gap:8px;padding:10px 14px 2px}
h1{margin:0;font-size:19px;cursor:text;outline:none;min-width:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dashed transparent}
h1:hover{border-bottom-color:var(--bd)}h1:focus{border-bottom-color:var(--ac)}
#stat{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
header button{font-size:12px;padding:2px 10px;white-space:nowrap}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 14px 8px;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap;padding:7px 12px;font-weight:700;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--tx)}
.tab.on{background:none;color:var(--ac);border-color:transparent;border-bottom-color:var(--ac)}
.tools{display:flex;gap:6px;align-items:center;margin-top:6px}
.tools #q{flex:1;min-width:0}
.tools button{white-space:nowrap}
.tools select{min-width:0;flex:0 1 auto}
#ffs{padding:5px 11px}
main{padding:12px 14px 60px}
body.treeview{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.treeview header,body.treeview .bar{flex:none}
body.treeview main{flex:1;min-height:0;padding:0}
body.treeview .tree-wrap{height:100%}
body.share header,body.share .bar,body.share main{display:none}
body.connecting main{visibility:hidden}
#ld{position:fixed;left:0;right:0;top:0;z-index:300;display:none}
#ld .t{height:4px;background:#0002}#ld .b{height:100%;width:0;background:var(--ac);transition:width .25s}
#ld .m{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px 14px;font-size:12px;color:var(--sub);white-space:nowrap}

/* ===== 카드 ===== */
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:9px 12px;box-shadow:0 1px 2px #0000000d;overflow-wrap:anywhere;min-width:0}
.card.fs{border-color:#f5a623}
.card.s-empty{border-left-color:#b9bdc7}.card.s-text{border-left-color:#55c89a}.card.s-warn{border-left-color:#f09a2b}.card.s-done{border-left-color:#4a86e8}
.card h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{margin:4px 0}.card p.onel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.clk{cursor:pointer}h3.clk:hover{color:var(--ac)}p.clk:hover{background:#6c5ce712;border-radius:6px}
.btns{display:flex;align-items:center;gap:2px;margin:-2px 0 2px -4px}
.btns button{border:0;background:none;padding:2px 6px;font-size:13px;color:var(--sub);white-space:nowrap}
.btns button:hover{color:var(--ac)}.btns button[data-a=del]:hover{color:var(--fs)}
.btns .dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ac);font-size:16px;padding:0 8px}
.st{cursor:pointer;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px}
.st.star svg{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linejoin:round}
.st.star.on svg{fill:#f5a623;stroke:#f5a623}
.st.cbx:before{content:"";width:18px;height:18px;border:2px solid var(--sub);border-radius:6px;background:var(--card);box-sizing:border-box;transition:background .12s,border-color .12s}
.st.cbx.on:before{background:var(--ac);border-color:var(--ac)}
.st.cbx.on:after{content:"";position:absolute;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.st.cbx{position:relative}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;border:2px solid var(--sub);border-radius:6px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;flex:none}
.chk input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.chk input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tags{margin-top:3px}.tags span{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;background:var(--blk);border-radius:6px;padding:0 7px;margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
.tags .it{background:none;border:1px dashed var(--blkbd);color:var(--sub)}
.memo{border-top:1px dashed var(--bd);margin-top:5px;padding-top:3px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nvrow{display:flex;gap:6px;margin-top:6px}
.nvrow button{font-size:12px;padding:2px 10px;border-style:dashed;color:var(--ac)}
.nvrow button.wr{border-style:solid;background:var(--ac);color:#fff;border-color:var(--ac)}
.ev{display:grid;grid-template-columns:80px 1fr;gap:12px;margin:8px 0}.ev>*{min-width:0}
.when{text-align:right;font-weight:700;padding-top:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.act{margin:20px 0 6px;font-weight:700;display:flex;align-items:center;gap:10px}.act:before{content:"";width:6px;height:18px;border-radius:3px;background:var(--ac)}
.insert-slot{margin:-2px 0 6px 92px;text-align:left;opacity:.45}.insert-slot:hover{opacity:1}
.insert-slot button,.tree-insert button{font-size:12px;padding:2px 10px;border-style:dashed;color:var(--ac);border-radius:999px}
.cmphd{display:flex;align-items:center;gap:6px}.cmphd h3{flex:1;min-width:0}.cmphd .btns{margin:0}
.csum{font-size:13px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpft{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px}.cmpft a{color:var(--ac);font-weight:700}
.cdet{margin-top:4px}.cdet summary{cursor:pointer;font-size:12px;color:var(--sub)}.kv{font-size:13px;margin:3px 0;white-space:pre-wrap}.kv b{color:var(--ac);margin-right:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
@media(min-width:561px){#list>.ev{position:relative;gap:0 22px}#list>.ev:before{content:"";position:absolute;left:91px;top:0;bottom:-8px;width:2px;background:var(--bd)}#list>.ev:after{content:"";position:absolute;left:86px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-sizing:content-box;margin-left:-3px}}
@media(max-width:560px){.ev{grid-template-columns:1fr;gap:2px}.when{text-align:left;padding:0;color:var(--sub)}.insert-slot{margin-left:0}header{flex-wrap:wrap}#stat{order:9;flex:1 1 100%;margin:0;font-size:11px}}

/* ===== 보드(세로 보기) ===== */
.tree-wrap{overflow:auto;overscroll-behavior:contain;scroll-snap-type:x proximity}
.tree{display:flex;align-items:flex-start;gap:12px;min-width:max-content;padding:12px 14px 28px}
.tree-act{width:236px;flex:0 0 236px;background:var(--blk);border:1px solid var(--blkbd);border-radius:16px;padding:0 8px 8px;scroll-snap-align:start;scroll-margin-left:12px;min-width:0}
.acthd{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:10px 2px 8px}
.tree-act h2{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ah{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ac);font-weight:400}
.accnt{font-size:12px;font-weight:700;color:var(--sub)}
.acprog{grid-column:1/-1;height:5px;border-radius:5px;background:#00000014;overflow:hidden}.acprog i{display:block;height:100%;background:linear-gradient(90deg,#55c89a,#4a86e8)}
.tree-node{margin:0 0 6px;border-radius:8px;min-width:0}
.tree-node .ev{grid-template-columns:1fr;gap:2px;margin:0}
.tree-node .when{text-align:left;padding:0 2px;color:var(--sub)}
.tree-insert{margin:0 0 8px;text-align:center;opacity:.4;transition:opacity .15s}.tree-insert:hover,.tree-insert:focus-within{opacity:1}
.ev.dragging{opacity:.3}.ghost{box-shadow:0 10px 30px #0004}
.tree-node.dbefore{box-shadow:0 -3px 0 0 var(--ac)}.tree-node.dafter{box-shadow:0 3px 0 0 var(--ac)}
.tree-act.dcol{background:#6c5ce722;outline:2px dashed var(--ac);outline-offset:2px}
.tree-act.dabefore{box-shadow:-4px 0 0 0 var(--ac)}.tree-act.daafter{box-shadow:4px 0 0 0 var(--ac)}.tree-act.dragact{opacity:.35}

/* ===== 장 / 휴지통 / 설정 ===== */
.aclist{max-width:760px}.acrow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:nowrap}
.acrow input{flex:1 1 auto;min-width:0;font-weight:700}.acrow button{flex:none;padding:4px 10px}.acrow .pl{white-space:nowrap}
.setgrid{display:grid;gap:12px;max-width:640px}.setgrid .row,.rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.setsample{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--bd);font-family:var(--wf);font-size:var(--wsz);line-height:1.9}
.toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 80px);transform:translate(-50%,12px);z-index:1000;background:rgba(32,36,56,.94);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 6px 20px #0004;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 전체 화면 대화창 (편집 / 읽기 공통 뼈대: 위 · 가운데(스크롤) · 아래) ===== */
dialog.full{border:0;padding:0;margin:0;width:100vw;max-width:none;height:100dvh;max-height:none;background:var(--bg);color:var(--tx)}
dialog.full[open]{display:flex;flex-direction:column}
dialog.full::backdrop{background:rgba(0,0,0,.5)}
dialog.full>form{flex:1;min-height:0;display:flex;flex-direction:column;margin:0}
.eh,.ef{display:flex;align-items:center;gap:8px;flex:none;background:var(--card);padding:8px max(14px,calc((100% - 820px)/2))}
.eh{border-bottom:1px solid var(--bd)}.eh b{font-size:15px;white-space:nowrap}
.eh button{flex:none;white-space:nowrap;font-size:12px;padding:3px 10px;border-radius:999px;color:var(--sub)}
.ef{border-top:1px solid var(--bd);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.ef .btn{padding:11px 16px;font-weight:700;white-space:nowrap}.ef .btn.p{flex:1}
.eb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px max(14px,calc((100% - 820px)/2)) 28px}
.eb label{display:block;font-size:13px;color:var(--sub);margin:10px 0 3px}
.eb input:not([type=checkbox]),.eb select,.eb textarea{width:100%;padding:9px 11px;font-size:16px}
.eb textarea:not(.actual-field){resize:none;overflow:hidden;min-height:44px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.fgrid .w{grid-column:1/-1}
.chk{display:flex;gap:18px;flex-wrap:wrap}.chk label{display:flex;align-items:center;gap:6px;color:var(--tx);margin:10px 0 3px}
.titlefld input{font-size:22px;font-weight:800;border:0;border-bottom:2px solid var(--bd);border-radius:0;background:transparent;padding:6px 2px;font-family:var(--wf)}
.titlefld input:focus{outline:none;border-bottom-color:var(--ac)}
details.evmeta,details.story-pickers{border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin:8px 0;background:var(--card)}
details>summary{cursor:pointer;font-size:13px;padding:8px 0;list-style-position:inside;user-select:none}
details[open]>summary{border-bottom:1px dashed var(--bd);margin-bottom:4px}
.spbody{padding-bottom:8px}
.pkrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border-radius:999px;padding:2px 12px;font-size:13px}
.edwrap{display:flex;align-items:stretch;overflow:hidden;border:1px solid var(--bd);border-radius:14px;background:var(--paper);margin:4px 0 8px}
.eb .edwrap textarea.actual-field{flex:1 1 0;min-width:0;width:auto}
.edln{flex:none;text-align:right;white-space:pre;color:var(--sub);background:#6c5ce711;border-right:1px dashed var(--bd);padding:16px 8px 16px 6px;font:12px ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none;pointer-events:none}
.nb.cur{border:2px solid var(--ac);background:var(--card);color:var(--tx);padding:8px 10px}
.nb.cur .nbh{color:var(--ac);font-weight:700}.nb.cur .nbh b{color:var(--tx)}
.nb.cur .edwrap{margin:6px 0 0}.nb.cur.closed .edwrap{display:none}
.nb.cur .curp{display:none;cursor:pointer;color:var(--sub);-webkit-mask-image:linear-gradient(to top,transparent,#000 60%);mask-image:linear-gradient(to top,transparent,#000 60%)}
.nb.cur.closed .curp{display:block}
.edwrap:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px #6c5ce722}
.eb textarea.actual-field{display:block;border:0;background:transparent;resize:none;overflow:hidden;min-height:42vh;font-family:var(--wf);font-size:var(--wsz);line-height:1.95;padding:16px 18px;outline:none;color:var(--tx)}
/* 앞·뒤 에피소드 미리보기 */
.nb{margin:8px 0;padding:8px 12px;border:1px dashed var(--blkbd);border-radius:12px;background:var(--blk);color:var(--sub)}
.nbh{display:flex;align-items:center;gap:8px;font-size:12px}.nbh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nbh b{color:var(--tx)}
.nbh button{border:0;background:none;color:var(--ac);padding:0 2px;font-size:12px;flex:none}
.nbt{font-family:var(--wf);font-size:14px;line-height:1.7;margin-top:4px}.nbt p{margin:0 0 3px;white-space:pre-wrap}
.nbt.short{max-height:6.2em;overflow:hidden;cursor:pointer}
.nb.prev .nbt.short{display:flex;flex-direction:column;justify-content:flex-end;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 60%);mask-image:linear-gradient(to bottom,transparent,#000 60%)}
.nb.next .nbt.short{-webkit-mask-image:linear-gradient(to top,transparent,#000 60%);mask-image:linear-gradient(to top,transparent,#000 60%)}
.nbt.full{display:none;max-height:45vh;overflow:auto}
.nb.open .full{display:block}.nb.open .short{display:none}
dialog.cfm{max-width:320px;width:calc(100% - 40px);height:fit-content;margin:auto;padding:20px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}

/* ===== 소설 읽기 ===== */
#nhead{position:relative;flex:none;background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
.nnav-bar{display:flex;align-items:center;gap:4px;padding:4px max(8px,calc((100% - 820px)/2))}
.nnav-step{flex:none;width:38px;height:38px;padding:0;border-radius:8px;font-size:20px;line-height:1;font-weight:700;color:var(--ac)}
#nclose{font-size:18px;color:var(--fs)}body.share #nclose{display:none}
.nnav-cur{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;text-align:left;background:var(--blk);border-color:var(--blkbd)}
.nnav-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.nnav-n{flex:none;font-size:12px;color:var(--sub)}.nnav-c{flex:none;color:var(--ac)}
.nnav-prog{height:8px;background:var(--bd);cursor:pointer;touch-action:none}.nnav-prog i{display:block;height:100%;width:0;background:var(--ac)}
.nnav-list{position:absolute;left:0;right:0;top:100%;max-height:60vh;overflow:auto;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:0 12px 24px #0003;padding:6px max(8px,calc((100% - 820px)/2))}
.nnav-act{margin:8px 4px 4px;font-size:12px;font-weight:700;color:var(--sub)}
.nnav-item{display:block;width:100%;margin:2px 0;padding:7px 10px;text-align:left;border-color:transparent;background:none}
.nnav-item.on{background:var(--blk);border-color:var(--blkbd);color:var(--ac);font-weight:700}
#nmenu{position:absolute;right:8px;top:100%;margin-top:2px;min-width:210px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 24px #0003;padding:8px;display:flex;flex-direction:column;gap:6px}
#nmenu button{text-align:left}#nmenu .nmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#nmenu .nfont{display:flex;gap:6px}
#nbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:8px max(0px,calc((100% - 820px)/2)) 48px}
#nbody.nocopy,#nbody.nocopy *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nv-code{font-family:var(--wf);font-size:var(--wsz);line-height:1.8}.nv-empty{color:var(--sub);padding:20px 14px}
.nl{display:flex;align-items:flex-start}.nl:hover{background:#6c5ce70d}
.nl .ln{flex:none;width:var(--w);box-sizing:content-box;text-align:right;padding:0 10px 0 8px;margin-right:12px;border-right:1px solid var(--bd);color:#9aa0b3;font:12px/1.9 ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none}
.nl .lt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding-right:12px}
.nl.nh .lt{font-weight:800;color:var(--ac)}
.nl.nchapter{margin-top:18px;padding-top:12px;border-top:2px solid var(--bd)}.nl.nchapter .lt{color:var(--ac);font-weight:800;font-size:1.08em}
.nl.flash{animation:nvflash 1.6s ease-out}@keyframes nvflash{0%,40%{background:#6c5ce740}100%{background:transparent}}
body.share #nview{display:none}

/* ===== 추가 수정 ===== */
.card{position:relative}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;pointer-events:none}
.btns button .ico{display:block}
.fsbadge{position:absolute;top:-9px;right:10px;width:20px;height:20px;border-radius:50%;background:#f5a623;display:grid;place-items:center;box-shadow:0 1px 3px #0003;pointer-events:none}
.fsbadge svg{width:12px;height:12px;fill:#fff;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.wpl{display:none}
.tree-node .wpl{display:inline}
.tree-node .plc,.tree-node .memo,.tree-node .nvrow{display:none}
.tree-node .btns [data-a=up],.tree-node .btns [data-a=dn]{display:none}
.tree-node .card{padding:6px 8px}

}

<script>
const ACTS=["프롤로그","1장","2장","3장","4장"];
const DEFTITLE="📖 소설 관리";
const RAW=[
["D-day","장소 A","프롤로그 에피소드","","홍길동","",0,0],
["D-10","장소 B","첫 만남","","홍길동,임꺽정","검",1,1],
["D-5","장소 C","갈등","","홍길동,임꺽정","",2,0],
["D+1","장소 D","전환점","","홍길동","",3,0],
["D+10","장소 E","결말","","홍길동,임꺽정","",4,0]
];
const SEEDE=RAW.map((r,i)=>({id:i+1,when:r[0],place:r[1],title:r[2],actual:"",chars:r[4],items:r[5],act:r[6],fs:!!r[7],memo:"",tags:""}));
const CH=[
["홍길동","주인공","성격을 입력하세요.","배경을 입력하세요.","변화(arc)를 입력하세요.","임꺽정의 친구","주인공"],
["임꺽정","조연","성격을 입력하세요.","배경을 입력하세요.","","홍길동의 친구","조연"]
];
const SEEDC=CH.map((r,i)=>({id:i+1,name:r[0],role:r[1],aliases:i==0?"길동":"",age:i==0?"27":"",look:"",personality:r[2],background:r[3],arc:r[4],relations:r[5],tags:r[6],memo:""}));
const SEEDI=[{id:1,name:"검",desc:"설명을 입력하세요.",owner:"임꺽정",memo:""}];
const arrOf=t=>t=="e"?D.events:t=="i"?D.items:D.chars;
const SCH={i:[["name","이름"],["desc","설명","ta"],["owner","소유자/관련 인물"],["memo","메모","ta"]],
 e:[["act","장","sel"],["when","시점"],["place","장소"],["title","제목"],["actual","내용","ta"],["chars","등장인물"],["items","아이템"],["fs","⭐ 중요","cb"],["done","☑ 작성 완료","cb"],["memo","메모","ta"]],
 c:[["name","이름"],["aliases","이명 (쉼표로 구분)"],["role","역할"],["age","나이/학년"],["look","외모","ta"],["personality","성격","ta"],["background","배경","ta"],["arc","변화(arc)","ta"],["relations","관계","ta"],["memo","메모","ta"]]};
const KEY="novel-mgr-v2",$=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const split=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const clone=x=>JSON.parse(JSON.stringify(x));
const SHARE=new URLSearchParams(location.search).has("novel");
if(SHARE)document.body.classList.add("share");
let PUB=SHARE; // 읽기 전용 공개 보기 (공유 링크이거나, 로그인하지 않은 방문자)
const ICON_TRASH='<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 ICON_PEN='<svg class="ico" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></svg>',
 FSBADGE='<span class="fsbadge" title="중요"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.9-4.7 4.5 1.2 6.4L12 17.4l-5.7 3.1 1.2-6.4-4.7-4.5 6.4-.9z"/></svg></span>';
// 편집 후 보드에서 반짝여 보여 줄 에피소드
const EDITED=new Set();let navHop=false;
function flashEdited(){
 if(!EDITED.size)return;const ids=[...EDITED];EDITED.clear();
 if($("ndlg").open)return;
 requestAnimationFrame(()=>ids.forEach((id,i)=>{
  const c=document.querySelector(`#list .ev[data-eid="${id}"] .card`);if(!c)return;
  if(i===0)c.scrollIntoView({block:"center",inline:"center",behavior:"smooth"});
  c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),3800);
 }));
}
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.events){D={events:clone(SEEDE),chars:clone(SEEDC)}}
const save=()=>{if(PUB)return;D.acts=clone(ACTS);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(window.fbHook)window.fbHook()};
let tab="tl",onlyFs=false,editing=null;
if(!D._tagsRemoved){[...D.events,...D.chars].forEach(o=>o.tags="");D._tagsRemoved=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const safeText=(v,fallback="")=>{
 if(v==null)return fallback;
 if(typeof v==="string")return v;
 if(typeof v==="number"||typeof v==="boolean")return String(v);
 if(Array.isArray(v))return v.map(x=>safeText(x)).filter(Boolean).join(", ");
 if(typeof v==="object"){for(const k of ["name","title","label","text","value","displayName"]){if(v[k]!=null&&typeof v[k]!=="object")return String(v[k])}try{return JSON.stringify(v)}catch(e){return fallback}}
 return fallback;
};
const actName=(a,i)=>(safeText(a&&typeof a==="object"?(a.name??a.title??a.label??a.text):a,`${i+1}장`)||`${i+1}장`).replace(/^(\d+)\u0020?\ub9c9/,"$1장");
const setActs=arr=>{ACTS.splice(0,ACTS.length,...arr.map((a,i)=>actName(a,i)))};
const normalizeData=()=>{
 if(!D||typeof D!=="object")D={events:[],chars:[]};
 if(!Array.isArray(D.events))D.events=[];
 if(!Array.isArray(D.chars))D.chars=[];
 if(!Array.isArray(D.trash))D.trash=[];
 D.trash=D.trash.filter(t=>t&&t.o&&["events","chars","items"].includes(t.k));
 if(!Array.isArray(D.items)){const seen=new Set();D.items=[];D.events.forEach(e=>String(e&&e.items||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!seen.has(n)){seen.add(n);D.items.push({id:D.items.length+1,name:n,desc:"",owner:"",memo:""})}}))}
 D.items=D.items.map((c,i)=>{if(!c||typeof c!=="object")c={name:safeText(c)};["name","desc","owner","memo"].forEach(k=>{c[k]=safeText(c[k],"")});c.id=Number(c.id)||i+1;return c});
 if(Array.isArray(D.acts)&&D.acts.length)setActs(D.acts);
 D.acts=clone(ACTS);
 if(typeof D.title!=="string")D.title=safeText(D.title,"");
 const ef=["when","place","title","actual","chars","items","tags","memo"];
 D.events=D.events.map((e,i)=>{
  if(!e||typeof e!=="object")e={title:safeText(e)};
  ef.forEach(k=>{e[k]=safeText(e[k],"")});
  e.id=Number(e.id)||i+1;
  e.act=Math.min(Math.max(0,Number(e.act)||0),ACTS.length-1);
  delete e.summary;e.fs=!!e.fs;e.done=!!e.done;return e;
 });
 const cf=["name","aliases","role","age","look","personality","background","arc","relations","tags","memo"];
 D.chars=D.chars.map((c,i)=>{if(!c||typeof c!=="object")c={name:safeText(c)};cf.forEach(k=>{c[k]=safeText(c[k],"")});c.id=Number(c.id)||i+1;return c});
};
normalizeData();save();
function fillActFilter(){const sel=$("fa"),v=sel.value;sel.innerHTML='<option value="">전체 장</option>'+ACTS.map((a,i)=>`<option value="${i}">${esc(a)}</option>`).join("");if([...sel.options].some(o=>o.value===v))sel.value=v}
fillActFilter();
// 이명(별칭): 어느 이름으로 선택·조회해도 같은 인물로 취급
const canon=n=>{const c=D.chars.find(x=>x.name===n||split(x.aliases).includes(n));return c?c.name:n};
const evHas=(e,name)=>split(e.chars).map(canon).includes(canon(name));
const aliasText=e=>split(e.chars).flatMap(n=>{const c=D.chars.find(x=>x.name===n||split(x.aliases).includes(n));return c?[c.name,...split(c.aliases)]:[]}).join(" ");
const charList=e=>[...new Set(split(e.chars).map(canon))];
const charLbl=n=>{const c=D.chars.find(x=>x.name===n),al=c?split(c.aliases):[];return n+(al.length?`(${al.join(", ")})`:"")};
const aliasLbl=n=>{const c=D.chars.find(x=>x.name===n);return c&&split(c.aliases).length?`(${esc(split(c.aliases).join(", "))})`:""};
const hit=(o,q,ks)=>!q||ks.map(k=>o[k]).join(" ").toLowerCase().includes(q);

function applyTitle(){const t=$("ttl");if(document.activeElement!==t)t.textContent=D.title||DEFTITLE;document.title=(D.title||DEFTITLE).replace(/^📖\s*/,"")}
$("ttl").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();ev.target.blur()}});
$("ttl").addEventListener("blur",()=>{const v=$("ttl").textContent.replace(/\s+/g," ").trim();D.title=v||DEFTITLE;$("ttl").textContent=D.title;save();document.title=D.title.replace(/^📖\s*/,"")});
$("ttl").addEventListener("paste",ev=>{ev.preventDefault();document.execCommand("insertText",false,(ev.clipboardData.getData("text/plain")||"").replace(/\s+/g," "))});

let PUBMAP=new Map(),PUBGOT=false,PUBMETAS="";
const stCls=e=>{const t=!!String(e.actual||"").trim();return e.done?(t?"s-done":"s-warn"):t?"s-text":"s-empty"};
const stIcons=e=>`<span class="st star ${e.fs?"on":""}" data-fstog="${e.id}" title="중요"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.9-4.7 4.5 1.2 6.4L12 17.4l-5.7 3.1 1.2-6.4-4.7-4.5 6.4-.9z"/></svg></span><span class="st cbx ${e.done?"on":""}" data-donetog="${e.id}" title="완료"></span>`;
const nvPrev=e=>{const t=String(e.actual||"").replace(/\s+/g," ").trim();return t?esc(t.length>50?t.slice(0,50)+"...":t):'<span class="pl">✍️ 눌러서 쓰기</span>'};
function evHTML(e,mini,drag){
 const tg=charList(e).map(c=>`<span class="nm" data-ch="${esc(c)}">👤 ${esc(charLbl(c))}</span>`).join("")+split(e.items).map(c=>`<span class="it" data-it="${esc(c)}">◇ ${esc(c)}</span>`).join("");
 return `<div class="ev" data-eid="${e.id}"><div class="when">${esc(e.when)}<span class="wpl">${e.place?` · ${esc(e.place)}`:""}</span></div><div class="card ${e.fs?"fs":""} ${stCls(e)}">${e.fs?FSBADGE:""}
 <div class="btns">${drag?`<button type="button" class="dh" data-i="${e.id}" title="드래그해서 이동">⠿</button>`:""}${stIcons(e)}${mini?"":`<span class="sp"></span>${drag?`<button type="button" data-a="wr" data-t="e" data-i="${e.id}" title="이어쓰기">${ICON_PEN}</button>`:""}<button data-a="up" data-t="e" data-i="${e.id}">▲</button><button data-a="dn" data-t="e" data-i="${e.id}">▼</button><button data-a="del" data-t="e" data-i="${e.id}" title="휴지통으로">${ICON_TRASH}</button>`}</div>
 <h3 class="clk" data-a="ed" data-t="e" data-i="${e.id}">${esc(e.title)||'<span class="pl">제목 없음</span>'}</h3>${e.place?`<div class="pl plc">📍 ${esc(e.place)}</div>`:""}<p class="clk onel" data-a="ed" data-t="e" data-i="${e.id}">${nvPrev(e)}</p>
 ${tg?`<div class="tags">${tg}</div>`:""}${e.memo?`<div class="memo">📝 ${esc(e.memo)}</div>`:""}
 <div class="nvrow"><button type="button" class="wr" data-a="wr" data-t="e" data-i="${e.id}">✍️ ${e.actual?"이어쓰기":"쓰기"}</button>${e.actual?`<button type="button" data-nv="${e.id}">📖 보기</button>`:""}</div></div></div>`}
function chHTML(c){
 const n=D.events.filter(e=>evHas(e,c.name)).length;
 const kv=(k,l)=>c[k]?`<div class="kv"><b>${l}</b>${esc(c[k])}</div>`:"";
 const one=[c.personality,c.background,c.arc,c.relations,c.look].find(x=>String(x||"").trim());
 const has=["look","personality","background","arc","relations"].some(k=>c[k])||c.memo;
 return `<div class="card cmp"><div class="cmphd"><h3 class="clk" data-a="ed" data-t="c" data-i="${c.id}">${esc(c.name)}${aliasLbl(c.name)} <span class="pl">${esc(c.role)}${c.age?" · "+esc(c.age):""}</span></h3><div class="btns"><button data-a="del" data-t="c" data-i="${c.id}" title="휴지통으로">${ICON_TRASH}</button></div></div>
 ${one?`<div class="csum">${esc(String(one).replace(/\s+/g," "))}</div>`:`<div class="csum pl">✍️ 눌러서 적기</div>`}
 <div class="cmpft"><a href="#" data-showch="${esc(c.name)}">타임라인 ${n}건</a></div>
 ${has?`<details class="cdet"><summary>자세히</summary>${kv("look","외모")}${kv("personality","성격")}${kv("background","배경")}${kv("arc","변화")}${kv("relations","관계")}${c.memo?`<div class="memo">📝 ${esc(c.memo)}</div>`:""}</details>`:""}</div>`}
function itHTML(c){
 const n=D.events.filter(e=>split(e.items).includes(c.name)).length;
 const own=split(c.owner).map(nm=>D.chars.some(x=>x.name===nm)?`<a href="#" data-ch="${esc(nm)}">${esc(nm)}</a>`:esc(nm)).join(", ");
 return `<div class="card cmp"><div class="cmphd"><h3 class="clk" data-a="ed" data-t="i" data-i="${c.id}">◇ ${esc(c.name)}</h3><div class="btns"><button data-a="del" data-t="i" data-i="${c.id}" title="휴지통으로">${ICON_TRASH}</button></div></div>
 ${c.desc?`<div class="csum">${esc(String(c.desc).replace(/\s+/g," "))}</div>`:`<div class="csum pl">✍️ 눌러서 적기</div>`}
 <div class="cmpft"><a href="#" data-showit="${esc(c.name)}">타임라인 ${n}건</a>${c.owner?`<span class="pl">👤 ${own}</span>`:""}</div>
 ${c.memo?`<details class="cdet"><summary>메모</summary><div class="memo">📝 ${esc(c.memo)}</div></details>`:""}</div>`}
function render(){
 const q=$("q").value.toLowerCase(),fa=$("fa").value,v=$("view").value;
 $("filters").hidden=tab!="tl";
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 {const tb=document.querySelector('.tab[data-tab="tr"]');if(tb)tb.textContent=`🗑 휴지통${D.trash&&D.trash.length?" "+D.trash.length:""}`}
 document.body.classList.toggle("treeview",tab=="tl"&&v=="tree");
 applyTitle();
 const oldWrap=document.querySelector(".tree-wrap"),sl=oldWrap?oldWrap.scrollLeft:0,st=oldWrap?oldWrap.scrollTop:0;
 let h="";
 $("add").textContent=tab=="ac"?"＋ 장":"＋ 추가";
 $("add").hidden=tab=="tr"||tab=="st";
 if(tab=="tr"){
  const KL={events:"에피소드",chars:"인물",items:"아이템"},T=D.trash.slice().sort((a,b)=>b.at-a.at).filter(t=>hit(t.o,q,["title","name","actual","desc","memo"]));
  const dt=at=>{const x=new Date(at);return `${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`};
  h=(D.trash.length?`<div class="rowb" style="margin-bottom:8px"><button data-tr="empty">휴지통 비우기</button></div>`:"")+
   (T.length?T.map(t=>`<div class="card" style="margin-bottom:8px"><div class="rowb"><span class="pl">${KL[t.k]} · ${dt(t.at)}</span><span class="sp"></span><button data-tr="restore" data-at="${t.at}" data-k="${t.k}">복원</button><button data-tr="purge" data-at="${t.at}" data-k="${t.k}">영구삭제</button></div><b>${esc(t.o.title||t.o.name||"(이름 없음)")}</b></div>`).join(""):`<p class="pl">휴지통이 비어 있습니다.</p>`);
  $("stat").textContent=`휴지통 ${D.trash.length}`;
 }else if(tab=="st"){
  const fam=document.documentElement.dataset.wf==="sans"?"고딕":"명조";
  h=`<div class="setgrid"><div class="card"><h3 style="margin:0 0 6px">🖋 글쓰기 화면</h3><div class="rowb"><button data-w="font">글꼴: ${fam}</button><button data-w="dn">A−</button><button data-w="up">A＋</button></div><p class="setsample">그는 천천히 걸음을 옮기며 오래된 기억을 떠올렸다. 바람이 불었다.</p></div>
  <div class="card"><h3 style="margin:0 0 6px">🌗 화면 테마</h3><div class="rowb"><span class="pl">${$("themeBtn").textContent}</span><button data-w="theme">바꾸기</button></div></div>
  <div class="card"><h3 style="margin:0 0 6px">💾 백업 / 복원</h3><div class="rowb"><button data-bk="json">📥 전체 백업(.json)</button><button data-bk="txt">📄 원문(.txt)</button>${isAdminNow()?`<button data-bk="import">📤 백업 불러오기</button>`:""}</div></div></div>`;
