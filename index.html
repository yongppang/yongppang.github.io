<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛나는 우리들 교회 · 소설 관리</title>
<style>
:root{color-scheme:dark;--bg:#111318;--card:#1b1f27;--tx:#e8eaf0;--sub:#a0a6b5;--bd:#343a46;--ac:#9b8cff;--fs:#ff7b80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif}
header{padding:20px 16px 4px;max-width:1200px;margin:auto}h1{margin:0;font-size:21px}#stat{margin:2px 0;color:var(--sub);font-size:12px}
.bar{position:sticky;top:0;background:var(--bg);z-index:5;max-width:1200px;margin:auto;padding:8px 16px;border-bottom:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;align-items:center}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{flex:1;min-width:140px}.chip{border-radius:99px;padding:1px 10px;font-size:12px}
.tab{font-weight:700;border:none;border-bottom:3px solid transparent;border-radius:0;background:none}.tab.on{color:var(--ac);background:none;border-bottom-color:var(--ac)}
main{max-width:1200px;margin:auto;padding:12px 16px 60px}
.act{margin:26px 0 6px;font-weight:700;color:var(--ac);border-bottom:2px solid var(--ac)}
.ev{display:grid;grid-template-columns:90px 1fr;gap:12px;margin:10px 0}
.when{text-align:right;font-weight:700;padding-top:12px}.when small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 14px}
.card.fs{border-left-color:var(--fs)}.card h3{margin:0;font-size:16px}.pl{color:var(--sub);font-size:13px}
.card p{margin:6px 0;white-space:pre-wrap}.tags span{display:inline-block;background:var(--bd);border-radius:6px;padding:0 7px;margin:2px 4px 2px 0;font-size:12px}
.tags .it{background:none;border:1px dashed var(--bd);color:var(--sub)}.tags .tg{background:none;color:var(--ac);cursor:pointer}.tags .nm{cursor:pointer}
.memo{border-top:1px dashed var(--bd);margin-top:6px;padding-top:4px;color:var(--sub);font-size:13px}.memo p{white-space:pre-wrap;max-height:420px;overflow:auto}textarea.actual-field{min-height:260px;border:2px solid var(--ac);background:#171522}
.btns{float:right;display:flex;gap:2px}.btns button{padding:0 7px;font-size:12px;border:none;background:none;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tree-wrap{overflow-x:auto;padding:8px 0 24px;scrollbar-width:thin}.tree{display:flex;align-items:stretch;gap:18px;min-width:max-content;padding:18px 8px 24px;position:relative}.tree-act{width:300px;flex:0 0 300px;position:relative;padding-top:28px}.tree-act:before{content:"";position:absolute;top:12px;left:-18px;right:-18px;height:2px;background:var(--ac);opacity:.55}.tree-act:first-child:before{left:0}.tree-act h2{position:absolute;top:-2px;left:0;margin:0;padding:2px 10px;background:var(--ac);color:#fff;border-radius:7px;font-size:13px;max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-node{position:relative;margin:12px 0;padding-left:15px}.tree-node:before{content:"";position:absolute;left:0;top:-12px;bottom:-12px;width:2px;background:var(--bd)}.tree-node:after{content:"";position:absolute;left:0;top:18px;width:12px;height:2px;background:var(--ac)}.tree-node:last-child:before{bottom:calc(100% - 20px)}.tree-node .card{padding:9px 10px}.tree-node .card p{font-size:13px;max-height:150px;overflow:auto}.act-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.act-tools button{font-size:12px}.btns button{font-size:13px;padding:2px 6px}.danger{color:var(--fs)!important}
.kv{font-size:13px;margin:3px 0;white-space:pre-wrap}.kv b{color:var(--ac);margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:min(560px,94vw)}
dialog label{display:block;font-size:12px;color:var(--sub);margin-top:8px}dialog input:not([type=checkbox]),dialog textarea,dialog select{width:100%}
@media(max-width:560px){.ev{grid-template-columns:1fr}.when{text-align:left;padding:0}}
</style>
</head>
<body>
<header><h1>📖 빛나는 우리들 교회 · 소설 관리</h1><div class="pl">수정본 · 사건 편집창에 ‘실제 내용 (소설 원문)’ 입력란 포함</div><div id="stat"></div></header>
<div class="bar">
 <div class="row"><button class="tab on" data-tab="tl">타임라인</button><button class="tab" data-tab="ch">인물설정</button><button id="actsEdit">막/프롤로그 편집</button>
 <span style="flex:1"></span><button class="p" id="add">+ 추가</button></div>
 <div class="row"><input id="q" placeholder="검색 (제목·내용·인물·태그·메모)">
 <select id="view"><option value="act">막별 보기</option><option value="tree">좌우 라인트리</option><option value="char">인물별 보기</option><option value="table">표 보기</option></select>
 <select id="fa"><option value="">전체 막</option></select><button id="ffs">🚩 복선만</button></div>
 <div class="row" id="tagbar"></div>
 <div class="row"><button class="p" id="gsave">☁ GitHub에 저장</button><button id="gset">⚙ GitHub 설정</button><button id="exp">내보내기(JSON)</button><button id="imp">불러오기</button><button id="srv">저장소 data.json 불러오기</button><button id="rst">초기화</button></div>
</div>
<main id="list"></main>
<dialog id="dlg"><form method="dialog" id="f"></form></dialog>
<dialog id="adlg"><form method="dialog" id="af"><h3 style="margin:0">막 / 프롤로그 관리</h3><p class="pl">막 이름을 직접 수정하고, 순서를 바꾸거나 추가·삭제할 수 있습니다. 막을 삭제하면 해당 사건은 직전 막으로 이동합니다.</p><div id="actRows"></div><div class="row"><button type="button" id="actAdd">+ 막 추가</button><span style="flex:1"></span><button class="p" value="ok">적용</button><button value="cancel" formnovalidate>취소</button></div></form></dialog>
<dialog id="gdlg"><form method="dialog" id="gf">
<h3 style="margin:0">GitHub 저장 설정</h3>
<label>GitHub 아이디(owner)</label><input name="owner">
<label>저장소 이름(repo)</label><input name="repo">
<label>브랜치</label><input name="branch">
<label>저장할 파일 경로</label><input name="path">
<label>Personal Access Token (이 브라우저에만 저장됩니다)</label><input name="token" type="password" placeholder="github_pat_...">
<p class="pl">GitHub → Settings → Developer settings → Fine-grained tokens에서 <b>이 저장소만</b> 선택하고 Contents 권한을 Read and write로 발급하세요.</p>
<div class="row"><button class="p" value="ok">저장</button><button value="cancel" formnovalidate>취소</button></div>
</form></dialog>
<input type="file" id="file" accept=".json" hidden>
<script>
const ACTS=["프롤로그","1막 · 접근 (D-100~D-50)","2막 · 몰입 (입교·헌신)","3막 · 균열 (진실)","4막 · 파국 (폭로)"];
const RAW=[
["D-day","예배당 (기도회 20~22시)","통성 기도회, 방언",`저녁 8시부터 통성 기도회.
한태양: 방언이 터지지 않자 좌절하며 욕설 섞인 기도를 뱉음.
변대한: 계단 구석에서 방언 기도에 성공.
방언 후 태양을 향한 은근한 질투, '태양이나 도현이보다 영적으로 낫다'는 우월감이 싹틈.`,"변대한,한태양","마이크",0,0],
["D-100","동네 사거리 PC방 (20시)","PC방의 재회","대한과 태양이 전쟁 게임 중. 과제를 프린트하러 온 차도현과 우연히 조우. 도현의 냉소적이고 차가운('싸가지') 태도가 드러남.","변대한,한태양,차도현","마우스,모니터,프린터기",1,0],
["D-95","집 → 초등학교 → 차도현의 방","도현의 집, 닫힌 2층 방","거실 가족사진(부모님, 누나 차하나, 도현). 2층의 닫힌 방을 보고 대한이 '누나 방이냐, 인사드려야 하는 것 아니냐'고 묻자 도현이 뜬금없이 화냄 → 곧 사과하며 '지금 안 계신다'고 얼버무림. 도현이 대한에게 전도서 구절을 전해줌.","변대한,차도현,차하나","검은 낡은 성경책,책갈피",1,1],
["D-90","호프집","균열의 시작, 지방대 드립","도현이 먼저 도착. 깔끔하게 차려입은 도현 / 트레이닝복의 대한 / 형의 비싼 옷을 입은 태양. 고2 때 인서울 다짐하며 삭발한 추억(도현은 다 깎고 태양은 바리캉 배터리가 나가 반만 깎임). 취한 도현의 '지방대 드립'으로 분위기 급랭.","변대한,한태양,차도현","바리캉,맥주잔",1,0],
["D-85","집 (전화통화)","화해, 이예솔의 존재","태양이 먼저 전화해 도현과 화해했다고 알림. 노방전도를 당하다 '이예솔'을 봤다고 함(도현의 첫사랑). 도현은 이미 '빛나는 우리들 교회'와 예솔이 다니는 것을 알고 있었음. 태양·도현이 먼저 교회를 나가기 시작.","변대한,한태양,차도현,이예솔","",1,1],
["D-80","변대한의 집 (밤 10시)","밤 10시의 방문","태양·도현이 대한의 집에 찾아와 동창 추억팔이(\"걔 너 알잖아\")로 대한은 제집에서 소외감. 으르렁대다 같은 목적으로 다시 친해진 둘이 교회에 가자고 하자 대한도 오기로 따라나섬. 교회에서 새신자 담당 안경 누나 최유진을 처음 보고 호감.","변대한,한태양,차도현,최유진","",1,0],
["D-73","집","최유진과의 식사, 태양의 배신","한밤중 태양이 '유진 누나가 같이 식사하자고 한다'고 연락. 정작 태양은 나오지 않아 대한은 단둘이 식사. 배신감 + 유진의 상냥함·귀여움에 매료. 교회 이야기 후 다시 오라는 권유. 대한은 '연상 여자한테 잘 보이는 법'을 검색.","변대한,한태양,최유진","",1,1],
["D-60","교회","수요예배, 환대","유진의 권유로 첫 수요예배, 태양·도현 옆에 앉음. 새신자 소개 후 성도들의 반가운 환대. 어른은 없고 청년 위주. 유진이 토요 노방전도를 권유. 궁금해진 대한이 설명을 요구하자 도현은 '여기선 곤란하다'며 초등학교로 데려감.","변대한,차도현,한태양,최유진","",1,0],
["D-50","초등학교","도현의 교리 강의","도현이 예수·성령·방언·말씀·사탄·이단·교회 차이점·목사 설교 스타일·주의 종 관계(큰사모, 작은사모, 전도사, 두 아들)를 지나치게 상세히 설명. 대한이 '뭘 이렇게까지 자세히 아냐'고 묻자 대충 둘러댐. 대한은 첫사랑 예솔 때문인가 오해. 예솔을 묻는 대한을 한심하게 보는 도현의 반응이 포인트.","변대한,차도현","차가운 캔커피,낡은 검은 성경책",1,1],
["D-40","길거리","첫 노방전도","한태양과 함께 거리로 나가 노방전도.","변대한,한태양","",2,0],
["D-day","예배당 (재조명)","방언과 영적 도취","방언을 받은 후 성령을 입었다는 기쁨에 도취. 도현·태양보다 영적으로 앞섰다는 우월감. 언행이 점차 고압적·교만하게 변함.","변대한","",2,0],
["D+","교회","규칙과 교리의 체화","암묵적 룰과 교리를 이해. 성령을 받았으니 감사헌금, 시험에 들지 않으려면 십일조 필수(사탄은 물질로 먼저 시험). 교회 직책은 성령 받은 자만 가능, 방언은 구원의 필수 증거이자 '가장 기본적인 은사'. 성령을 받으면 광야의 예수처럼 시험이 온다고 교육.","변대한","",2,0],
["D+","교회 예배당","헌금 강조와 가스라이팅","목사의 기복 설교: '주님의 것을 인정해야 물질 축복, 천국엔 헌금보다 더 큰 상급'. 헌금 많이 한 성도 실명 칭찬, 특히 '첫열매'를 높임 → 알바하는 중고등학생들까지 첫열매를 바침.","변대한,목사","헌금봉투,팀별 헌금 현황판,마이크",2,1],
["D+","교회 예배당","인정욕구와 성격 변화","성령 후 새벽예배·말씀·전도·기도에 집착, 인정받으려 노력. 소심했던 과거에서 고압적으로 변함. 청년부 조장 박지원 형처럼 되면 자매들에게 인기 얻고 유진의 호감도 살 것이라 착각.","변대한,박지원,최유진","",2,0],
["D+","청년부 예배","중고등부 합동예배, 송하연","중고등부와 청년부 합동 예배. 고3 송하연과 첫 대화.","변대한,송하연","",2,0],
["D+","—","한태양의 가정사","태양이 부모님의 과거 칼부림 사건과 그로 인한 깊은 상처를 털어놓음.","한태양,변대한","",2,0],
["D+","—","신년","시간이 흘러 신년을 맞이.","","",2,0],
["D+","—","송하연의 고백","고3이던 송하연이 성인이 된 후 태양에게 고백.","송하연,한태양","",2,0],
["D+","—","비밀 교제와 하연의 가정사","태양과 하연이 연인으로 발전. 대한은 태양을 통해 하연의 불우한 가정사를 듣게 됨.","한태양,송하연,변대한","",2,0],
["D+","도로 → 병원","변대한의 교통사고","전도기록지를 집에 두고 와 자전거로 가지러 가던 중 트럭과 충돌. 뇌진탕으로 의식을 잃었다 병원에서 눈을 뜸. 골절로 입원.","변대한","전도기록지,자전거",3,0],
["D+","병원","태양의 고백, 투 아웃","태양이 병문안 와서 진실을 고백: 하연과 사귀다 걸렸는데 '투 아웃'. 첫 번째 상대가 최유진 누나였음(주의 종 허락이 필요해 유진이 비밀로 하자고 함). 대한은 큰 배신감을 느끼나 억누르고 일단 넘어감. 태양은 몰래 연애하다 작은사모에게 적발됨.","변대한,한태양,최유진,송하연","",3,1],
["D+","—","차도현에게 온 편지 ①","군 입대한 도현의 편지를 태양이 전달. 조준일이 도현의 누나 차하나와 비밀 교제 → 바람기로 금방 질리자 '믿음 부족한 여자와 사귈 수 없다'며 이별 통보. 하나는 믿음에 광적으로 집착(헌금·기도·예배), 혼잣말로 하나님 음성을 들음, 정신적으로 무너져 알바로 연명하다 큰 병을 얻어 사망. 큰사모는 알고도 조준일이 전도 핵심 팀장이라 덮음. 조준일은 여전히 여성 교인에게 나쁜 짓, 조원 헌금을 PC방·유흥비로 탕진. 도현은 방송현에게 확인하라 함. 예솔이 아닌 '증인'으로 삼으려 대한에게 접근했음을 밝힘.","변대한,차도현,조준일,차하나,한태양","편지",3,1],

   const names=[...new Set([...D.chars.map(c=>c.name),...L.flatMap(e=>split(e.chars))])];
   names.forEach(n=>{const l=L.filter(e=>split(e.chars).includes(n));if(l.length)h+=`<div class="act">👤 ${esc(n)} (${l.length})</div>`+l.map(e=>evHTML(e,1)).join("")})}
  else h=`<div class="tw"><table><tr><th>시점</th><th>막</th><th>제목</th><th>인물</th><th>태그</th><th></th></tr>${L.map(e=>`<tr><td>${esc(e.when)}</td><td>${esc((ACTS[e.act]||"").slice(0,2))}</td><td>${e.fs?"🚩 ":""}${esc(e.title)}</td><td>${esc(e.chars)}</td><td>${esc(e.tags)}</td><td><button data-a="ed" data-t="e" data-i="${e.id}">✎</button></td></tr>`).join("")}</table></div>`;
  $("stat").textContent=`사건 ${D.events.length}개 · 복선 ${D.events.filter(e=>e.fs).length}개 · 표시 ${L.length}개`;
 }
 $("list").innerHTML=h||"<p class='pl'>해당하는 항목이 없습니다.</p>";
}
function openEd(t,id){
 editing={t,id};const o=(id&&D[t=="e"?"events":"chars"].find(x=>x.id==id))||{act:2,when:"D+"};
 $("f").innerHTML=`<h3 style="margin:0">${t=="e"?"사건":"인물"} ${id?"수정":"추가"}</h3>`+SCH[t].map(([k,l,ty])=>{
  const val=o[k]??"";
  if(ty=="ta")return `<label>${l}</label><textarea class="${k==="actual"?"actual-field":""}" name="${k}" rows="${k==="actual"?12:3}" placeholder="${k==="summary"?"사건의 핵심을 간단히 요약해 주세요.":k==="actual"?"이 사건의 실제 소설 원문을 붙여 넣거나 작성하세요.":""}">${esc(val)}</textarea>`;
  if(ty=="cb")return `<label><input type="checkbox" name="${k}" ${val?"checked":""}> ${l}</label>`;
  if(ty=="sel")return `<label>${l}</label><select name="${k}">${ACTS.map((a,i)=>`<option value="${i}" ${i==val?"selected":""}>${a}</option>`).join("")}</select>`;
  return `<label>${l}</label><input name="${k}" value="${esc(val)}">`}).join("")+
  `<div class="row" style="margin-top:12px"><button class="p" value="ok">저장</button><button value="cancel" formnovalidate>취소</button></div>`;
 $("dlg").showModal();
}
$("f").addEventListener("submit",ev=>{
 if(ev.submitter.value!="ok")return;const {t,id}=editing,f=$("f"),arr=D[t=="e"?"events":"chars"],d={};
 SCH[t].forEach(([k,,ty])=>d[k]=ty=="cb"?f[k].checked:ty=="sel"?+f[k].value:f[k].value);
 if(id)Object.assign(arr.find(x=>x.id==id),d);else arr.push({id:Math.max(0,...arr.map(x=>x.id))+1,...d});
 save();render();
});
function drawActRows(){
 const host=$("actRows");host.innerHTML=ACTS.map((a,i)=>`<div class="row" data-actrow="${i}" style="border-bottom:1px solid var(--bd);padding:5px 0"><input data-actname="${i}" value="${esc(a)}" style="flex:1;min-width:170px"><button type="button" data-actmove="up" data-idx="${i}" ${i===0?"disabled":""}>←</button><button type="button" data-actmove="dn" data-idx="${i}" ${i===ACTS.length-1?"disabled":""}>→</button><button type="button" class="danger" data-actdel="${i}">삭제</button></div>`).join("");
}
$("actsEdit").onclick=()=>{drawActRows();$("adlg").showModal()};
$("actAdd").onclick=()=>{const inputs=[...document.querySelectorAll("[data-actname]")];inputs.forEach((el,i)=>ACTS[i]=el.value.trim()||ACTS[i]);ACTS.push(`${ACTS.length}막 · 새 막`);drawActRows()};
$("actRows").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const i=+b.dataset.idx;
 if(b.dataset.actmove){const inputs=[...document.querySelectorAll("[data-actname]")];inputs.forEach((el,j)=>ACTS[j]=el.value.trim()||ACTS[j]);const j=b.dataset.actmove==="up"?i-1:i+1;[ACTS[i],ACTS[j]]=[ACTS[j],ACTS[i]];D.events.forEach(e=>{if(+e.act===i)e.act=j;else if(+e.act===j)e.act=i});drawActRows()}
 if(b.dataset.actdel!==undefined){const del=+b.dataset.actdel;if(ACTS.length<=1){alert("막은 최소 1개 이상 있어야 합니다.");return}const inputs=[...document.querySelectorAll("[data-actname]")];inputs.forEach((el,j)=>ACTS[j]=el.value.trim()||ACTS[j]);if(!confirm(`「${ACTS[del]}」을 삭제할까요? 이 막의 사건은 이전 막으로 이동합니다.`))return;ACTS.splice(del,1);D.events.forEach(e=>{if(+e.act===del)e.act=Math.max(0,del-1);else if(+e.act>del)e.act--});drawActRows()}
});
$("af").addEventListener("submit",ev=>{if(ev.submitter.value!=="ok")return;const inputs=[...document.querySelectorAll("[data-actname]")];const names=inputs.map(el=>el.value.trim()).filter(Boolean);if(!names.length){ev.preventDefault();alert("막 이름을 하나 이상 입력하세요.");return}ACTS.splice(0,ACTS.length,...names);fillActFilter();D.events.forEach(e=>{e.act=Math.min(Math.max(0,+e.act||0),ACTS.length-1)});save();$("fa").innerHTML='<option value="">전체 막</option>'+ACTS.map((a,i)=>`<option value="${i}">${esc(a)}</option>`).join("");render()});
$("add").onclick=()=>openEd(tab=="tl"?"e":"c");
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-a],[data-tab],[data-tag],[data-ch],[data-showch]");if(!el)return;
 const d=el.dataset;
 if(d.tab){tab=d.tab}
 else if(d.tag){d.tag&&(ft.has(d.tag)?ft.delete(d.tag):ft.add(d.tag))}
 else if(d.showch){ev.preventDefault();tab="tl";$("view").value="char";$("q").value=d.showch}
 else if(d.ch){tab="ch";$("q").value=d.ch}
 else if(d.a){
  const arr=D[d.t=="e"?"events":"chars"],i=arr.findIndex(x=>x.id==d.i);
  if(d.a=="ed"){openEd(d.t,d.i);return}
  if(d.a=="del"){if(!confirm(`「${arr[i].title||arr[i].name}」을(를) 삭제할까요? 삭제 후에는 복구할 수 없습니다.`))return;arr.splice(i,1)}
  if(d.a=="up"&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];
  if(d.a=="dn"&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
  save();
 }
 render();
});
$("q").oninput=render;$("fa").onchange=render;$("view").onchange=render;
$("ffs").onclick=()=>{onlyFs=!onlyFs;$("ffs").classList.toggle("on",onlyFs);render()};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="data.json";a.click()};
const load=d=>{if(d&&Array.isArray(d.events)&&Array.isArray(d.chars)){D=d;save();render();return true}alert("올바른 data.json 형식이 아닙니다.")};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async ev=>{try{load(JSON.parse(await ev.target.files[0].text()))}catch(e){alert("JSON 읽기 실패")}};
$("srv").onclick=async()=>{try{const r=await fetch("data.json?"+Date.now());if(!r.ok)throw 0;if(confirm("저장소의 data.json으로 덮어쓸까요?"))load(await r.json())}catch(e){alert("data.json을 찾을 수 없습니다. (GitHub Pages 등 웹에서 열어야 합니다)")}};
$("rst").onclick=()=>{if(confirm("초기 데이터로 되돌릴까요? 저장된 수정이 사라집니다.")){D={events:clone(SEEDE),chars:clone(SEEDC)};save();render()}};

const GK="novel-gh";
const guess=()=>{const m=location.hostname.match(/^(.+)\.github\.io$/);return{owner:m?m[1]:"",repo:m?(location.pathname.split("/")[1]||""):"",branch:"main",path:"data.json",token:""}};
let GH;try{GH={...guess(),...JSON.parse(localStorage.getItem(GK))}}catch(e){GH=guess()}
$("gset").onclick=()=>{const f=$("gf");["owner","repo","branch","path","token"].forEach(k=>f[k].value=GH[k]||"");$("gdlg").showModal()};
$("gf").addEventListener("submit",ev=>{if(ev.submitter.value!="ok")return;const f=$("gf");
 ["owner","repo","branch","path","token"].forEach(k=>GH[k]=f[k].value.trim());
 try{localStorage.setItem(GK,JSON.stringify(GH))}catch(e){}});
$("gsave").onclick=async()=>{
 if(!GH.owner||!GH.repo||!GH.token){alert("먼저 ⚙ GitHub 설정에서 아이디·저장소·토큰을 입력하세요.");$("gset").click();return}
 const b=$("gsave"),old=b.textContent;b.textContent="저장 중...";b.disabled=true;
 const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path.split("/").map(encodeURIComponent).join("/")}`;
 const H={Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json"};
 try{
  let sha;const g=await fetch(`${url}?ref=${encodeURIComponent(GH.branch)}&t=${Date.now()}`,{headers:H});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error("조회 실패 "+g.status+" (토큰·저장소 이름·권한 확인)");
  const body={message:"update novel data "+new Date().toLocaleString("ko-KR"),content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),branch:GH.branch};
  if(sha)body.sha=sha;
  const p=await fetch(url,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!p.ok)throw new Error("저장 실패 "+p.status+": "+((await p.json()).message||""));
  b.textContent="✅ 저장됨";setTimeout(()=>{b.textContent=old},2000);
 }catch(e){alert(e.message);b.textContent=old}
 b.disabled=false;
};
(async()=>{ // 저장된 로컬 데이터가 없으면 저장소의 data.json을 자동 로드
 if(!localStorage.getItem(KEY)){try{const r=await fetch("data.json");if(r.ok){const d=await r.json();if(d&&d.events&&d.chars)D=d}}catch(e){}}
 render();
})();
</script>
