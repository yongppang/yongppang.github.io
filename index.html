<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<title>소설 관리</title>
<script>(function(){try{var m=localStorage.getItem("novel-theme")||"auto";var d=m==="dark"||(m==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}})()</script>
<style>
:root{color-scheme:light;--bg:#f5f6fa;--card:#fff;--blk:#efecff;--blkbd:#d3cdf6;--tx:#1f2330;--sub:#6a7083;--bd:#dfe2ea;--ac:#6c5ce7;--fs:#e5484d;--paper:#fffdf8;--wf:"Noto Serif KR","Noto Serif CJK KR","Source Han Serif K","Nanum Myeongjo","나눔명조","Batang","바탕","AppleMyungjo",serif;--wsz:17px}
:root[data-wf=sans]{--wf:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#10121a;--card:#1a1d2b;--blk:#232848;--blkbd:#3b427a;--tx:#e9ebf5;--sub:#9ba2bc;--bd:#2d3248;--ac:#8d7fff;--fs:#ff6d73;--paper:#161a28}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.35;cursor:default}
.pl{color:var(--sub);font-size:13px}
.sp{flex:1}
.rolechip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);white-space:nowrap}
.rolechip.adm{background:var(--blk);color:var(--ac);border-color:var(--blkbd)}
.rolechip.usr{background:#e4f7ec;color:#1f7a50;border-color:#b5e3c9}
:root[data-theme=dark] .rolechip.usr{background:#1d3f36;color:#7fe3b8;border-color:#2f8a70}

/* ===== 상단 ===== */
header{display:flex;align-items:center;gap:8px;padding:10px 14px 2px}
h1{margin:0;font-size:19px;cursor:text;outline:none;min-width:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dashed transparent}
h1:hover{border-bottom-color:var(--bd)}h1:focus{border-bottom-color:var(--ac)}
#stat{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
header button{font-size:12px;padding:2px 10px;white-space:nowrap}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 14px 8px;border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.bar-toggle{margin-left:auto;flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--sub);box-shadow:0 1px 2px #00000008}
.bar-toggle svg{width:18px;height:18px;display:block;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bar-toggle:hover{color:var(--ac);border-color:var(--ac)}
#toolRows{display:block}.bar.tools-collapsed #toolRows{display:none}
.tab{flex:none;white-space:nowrap;padding:7px 12px;font-weight:700;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--tx)}
.tab.on{background:none;color:var(--ac);border-color:transparent;border-bottom-color:var(--ac)}
.tools{display:flex;gap:6px;align-items:center;margin-top:6px}
.tools #q{flex:1;min-width:0}
.tools button{white-space:nowrap}
.ibtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;padding:6px 0}.ibtn .ico{width:18px;height:18px}
.tools select{min-width:0;flex:0 1 auto}
#ffs{padding:5px 11px}
main{padding:12px 14px 60px}
body.treeview{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.treeview header,body.treeview .bar{flex:none}
body.treeview main{flex:1;min-height:0;padding:0}
body.treeview .tree-wrap{height:100%}
body.share header,body.share .bar,body.share main{display:none}
body.connecting main{visibility:hidden}
/* Firebase 데이터 확인 전에는 관리자 화면을 숨기고, 관리자 데이터 로딩 완료 후에만 표시 */
body.booting header,body.booting .bar,body.booting main{visibility:hidden}
#ld{position:fixed;left:0;right:0;top:0;z-index:300;display:none}
#ld .t{height:4px;background:#0002}#ld .b{height:100%;width:0;background:var(--ac);transition:width .25s}
#ld .m{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px 14px;font-size:12px;color:var(--sub);white-space:nowrap}

/* ===== 카드 ===== */
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:9px 12px;box-shadow:0 1px 2px #0000000d;overflow-wrap:anywhere;min-width:0}
.card.fs{border-color:#f5a623}
.card.s-empty{border-left-color:#b9bdc7}.card.s-text{border-left-color:#55c89a}.card.s-warn{border-left-color:#f09a2b}.card.s-done{border-left-color:#4a86e8}
/* 사용자 지정 색상: 두 테마에서 같은 색조를 유지하고 다크 모드에서는 20%만 은은하게 적용 */
.card[style*="--user-block-color"]{background:color-mix(in srgb,var(--user-block-color) 24%,var(--card))}
:root[data-theme=dark] .card[style*="--user-block-color"]{background:color-mix(in srgb,var(--user-block-color) 20%,var(--card))}
/* 타임라인 에피소드 블럭은 외곽선을 한 줄로 통일 */
.ev>.card{border:1px solid var(--bd)}.ev>.card.fs{border-color:#f5a623}
.card h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card p{margin:4px 0}.card p.onel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.clk{cursor:pointer}h3.clk:hover{color:var(--ac)}p.clk:hover{background:#6c5ce712;border-radius:6px}
.btns{display:flex;align-items:center;gap:2px;margin:-2px 0 2px -4px}
.btns button{border:0;background:none;padding:2px 6px;font-size:13px;color:var(--sub);white-space:nowrap}
.btns button:hover{color:var(--ac)}.btns button[data-a=del]:hover{color:var(--fs)}
.btns .dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ac);font-size:16px;padding:0 8px}
.st{cursor:pointer;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px}
.st.star svg{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linejoin:round}
.st.star.on svg{fill:#f5a623;stroke:#f5a623}
.st.cbx:before{content:"";width:18px;height:18px;border:2px solid var(--sub);border-radius:6px;background:var(--card);box-sizing:border-box;transition:background .12s,border-color .12s}
.st.cbx.on:before{background:var(--ac);border-color:var(--ac)}
.st.cbx.on:after{content:"";position:absolute;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.st.cbx{position:relative}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;padding:0;margin:0;border:2px solid var(--sub);border-radius:6px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;flex:none}
.chk input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.chk input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tags{display:flex;flex-wrap:wrap;align-items:flex-start;gap:3px 4px;margin-top:3px;min-width:0}.tags span{display:inline-block;box-sizing:border-box;max-width:100%;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere;word-break:normal;vertical-align:top;background:var(--blk);border-radius:6px;padding:1px 7px;margin:0;font-size:12px;line-height:1.45;cursor:pointer}
.tags .it{background:none;border:1px dashed var(--blkbd);color:var(--sub)}
.memo{border-top:1px dashed var(--bd);margin-top:5px;padding-top:3px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nvrow{display:flex;gap:6px;margin-top:6px}
.nvrow button{font-size:12px;padding:2px 10px;border-style:dashed;color:var(--ac)}
.nvrow button.wr{border-style:solid;background:var(--ac);color:#fff;border-color:var(--ac)}
.ev{display:grid;grid-template-columns:80px 1fr;gap:12px;margin:8px 0}.ev>*{min-width:0}
.when{text-align:right;font-weight:700;padding-top:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.act{margin:20px 0 6px;font-weight:700;display:flex;align-items:center;gap:10px}.act:before{content:"";width:6px;height:18px;border-radius:3px;background:var(--ac)}
.insert-slot{margin:-2px 0 6px 92px;text-align:left;opacity:.45}.insert-slot:hover{opacity:1}
.insert-slot button,.tree-insert button{font-size:12px;padding:2px 10px;border-style:dashed;color:var(--ac);border-radius:999px}
.cmphd{display:flex;align-items:center;gap:6px}.cmphd h3{flex:1;min-width:0}.cmphd .btns{margin:0}
.csum{font-size:13px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpft{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px}.cmpft a{color:var(--ac);font-weight:700}
.cdet{margin-top:4px}.cdet summary{cursor:pointer;font-size:12px;color:var(--sub)}.kv{font-size:13px;margin:3px 0;white-space:pre-wrap}.kv b{color:var(--ac);margin-right:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
@media(min-width:561px){#list>.ev{position:relative;gap:0 22px}#list>.ev:before{content:"";position:absolute;left:91px;top:0;bottom:-8px;width:2px;background:var(--bd)}#list>.ev:after{content:"";position:absolute;left:86px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-sizing:content-box;margin-left:-3px}}
@media(max-width:560px){.ev{grid-template-columns:1fr;gap:2px}.when{text-align:left;padding:0;color:var(--sub)}.insert-slot{margin-left:0}header{flex-wrap:wrap}#stat{order:9;flex:1 1 100%;margin:0;font-size:11px}}

/* ===== 보드(세로 보기) ===== */
.tree-wrap{overflow:auto;overscroll-behavior:contain;scroll-snap-type:x proximity}
.tree{display:flex;align-items:flex-start;gap:12px;min-width:max-content;padding:12px 14px 28px}
.tree-act{width:236px;flex:0 0 236px;background:var(--blk);border:1px solid var(--blkbd);border-radius:16px;padding:0 8px 8px;scroll-snap-align:start;scroll-margin-left:12px;min-width:0}
.acthd{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:10px 2px 8px}
.tree-act h2{margin:0;font-size:15px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ah{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ac);font-weight:400}
.accnt{font-size:12px;font-weight:700;color:var(--sub)}
.acprog{grid-column:1/-1;height:5px;border-radius:5px;background:#00000014;overflow:hidden}.acprog i{display:block;height:100%;background:linear-gradient(90deg,#55c89a,#4a86e8)}
.tree-node{margin:0 0 6px;border-radius:8px;min-width:0}
.tree-node .ev{grid-template-columns:1fr;gap:2px;margin:0}
.tree-node .when{text-align:left;padding:0 2px;color:var(--sub)}
.tree-insert{margin:0 0 8px;text-align:center;opacity:.4;transition:opacity .15s}.tree-insert:hover,.tree-insert:focus-within{opacity:1}
.wiggle{animation:wig .13s linear infinite}@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.8deg) translateX(-1px)}75%{transform:rotate(1.8deg) translateX(1px)}}
.ev.dragging{opacity:.3}.ghost{box-shadow:0 10px 30px #0004}
.tree-node.dbefore{box-shadow:0 -3px 0 0 var(--ac)}.tree-node.dafter{box-shadow:0 3px 0 0 var(--ac)}
.tree-act.dcol{background:#6c5ce722;outline:2px dashed var(--ac);outline-offset:2px}
.tree-act.dabefore{box-shadow:-4px 0 0 0 var(--ac)}.tree-act.daafter{box-shadow:4px 0 0 0 var(--ac)}.tree-act.dragact{opacity:.35}

/* ===== 장 / 휴지통 / 설정 ===== */
.aclist{max-width:760px}.acrow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:nowrap}
.acrow input{flex:1 1 auto;min-width:0;font-weight:700}.acrow button{flex:none;padding:4px 10px}.acrow .pl{white-space:nowrap}
.setgrid{display:grid;gap:12px;max-width:640px}.setgrid .row,.rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.setsample{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--bd);font-family:var(--wf);font-size:var(--wsz);line-height:1.9}
.toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 80px);transform:translate(-50%,12px);z-index:2147483647;background:rgba(32,36,56,.96);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 6px 20px #0004;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 전체 화면 대화창 (편집 / 읽기 공통 뼈대: 위 · 가운데(스크롤) · 아래) ===== */
dialog.full{border:0;padding:0;margin:0;width:100vw;max-width:none;height:var(--vvh,100dvh);max-height:none;background:var(--bg);color:var(--tx)}
dialog.full[open]{display:flex;flex-direction:column}
dialog.full::backdrop{background:rgba(0,0,0,.5)}
dialog.full>form{flex:1;min-height:0;display:flex;flex-direction:column;margin:0}
.eh,.ef{display:flex;align-items:center;gap:8px;flex:none;background:var(--card);padding:8px max(14px,calc((100% - 820px)/2))}
.eh{border-bottom:1px solid var(--bd)}.eh b{font-size:15px;white-space:nowrap}
.eh button{flex:none;white-space:nowrap;font-size:12px;padding:3px 10px;border-radius:999px;color:var(--sub)}
.ef{border-top:1px solid var(--bd);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.ef .btn{padding:11px 16px;font-weight:700;white-space:nowrap}.ef .btn.p{flex:1}.ef .btn.sm{padding:11px 11px}
.eb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px max(14px,calc((100% - 820px)/2)) 28px}
.eb label{display:block;font-size:13px;color:var(--sub);margin:10px 0 3px}
.eb input:not([type=checkbox]),.eb select,.eb textarea{width:100%;padding:9px 11px;font-size:16px}
.eb textarea:not(.actual-field){resize:none;overflow:hidden;min-height:44px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.fgrid .w{grid-column:1/-1}
.chk{display:flex;gap:18px;flex-wrap:wrap}.chk label{display:flex;align-items:center;gap:6px;color:var(--tx);margin:10px 0 3px}
.titlefld input{font-size:22px;font-weight:800;border:0;border-bottom:2px solid var(--bd);border-radius:0;background:transparent;padding:6px 2px;font-family:var(--wf)}
.titlefld input:focus{outline:none;border-bottom-color:var(--ac)}
details.evmeta,details.story-pickers{border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin:8px 0;background:var(--card)}
details>summary{cursor:pointer;font-size:13px;padding:8px 0;list-style-position:inside;user-select:none}
details[open]>summary{border-bottom:1px dashed var(--bd);margin-bottom:4px}
.spbody{padding-bottom:8px}
.pkrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border-radius:999px;padding:2px 12px;font-size:13px}
.edwrap{display:flex;align-items:stretch;overflow:hidden;border:1px solid var(--bd);border-radius:14px;background:var(--paper);margin:4px 0 8px}
.eb .edwrap textarea.actual-field{flex:1 1 0;min-width:0;width:auto}
.edln{flex:none;text-align:right;white-space:pre;color:var(--sub);background:#6c5ce711;border-right:1px dashed var(--bd);padding:16px 8px 16px 6px;font:12px ui-monospace,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none;pointer-events:none}
.qbar{flex:none;background:var(--card);border-top:1px solid var(--bd);padding:2px max(14px,calc((100% - 820px)/2))}
.qhint{display:block;width:100%;border:0;background:none;text-align:left;font-size:12px;color:var(--sub);padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qhint span{opacity:.8}
.qbar .qopen{display:none}.qbar.open .qopen{display:block}.qbar.open .qhint{display:none}
.qhead{display:flex;align-items:center;gap:6px;padding:6px 0 0}
.qtab{border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}.qtab.on{background:var(--blk);color:var(--ac);border-color:var(--blkbd)}
.qchips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;position:relative;scrollbar-width:none;overscroll-behavior-x:contain}.qchips::-webkit-scrollbar{display:none}
@media (pointer:fine){.qchips{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:142px;scrollbar-width:thin}.qchips::-webkit-scrollbar{display:initial;width:8px}}
.qchip{flex:none;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.qchip.in{border-color:var(--ac);color:var(--ac)}.qchip.in:before{content:"✓ "}
.qchip.hi{background:var(--ac);color:#fff;border-color:var(--ac)}
.qchip small{font-size:11px;opacity:.7;margin-left:3px}.qchip.hi small{opacity:.85}
.qchip.new{border-style:dashed;color:var(--ac)}
.castrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:7px 10px;border-radius:12px;border:1px dashed var(--blkbd);background:var(--card)}
.castrow .nm,.castrow .it{background:var(--blk);border-radius:6px;padding:1px 8px;font-size:12px}.castrow .it{background:none;border:1px dashed var(--blkbd)}.castrow .pl{font-size:12px}.castadd{margin-left:auto}
dialog.pkm{width:min(92vw,440px);max-height:82dvh;margin:auto;padding:0;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);overflow:hidden}
dialog.pkm[open]{display:flex;flex-direction:column}dialog.pkm::backdrop{background:rgba(0,0,0,.5)}
.pkh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}.pkh b{flex:1}
.pkb{padding:4px 14px 14px;overflow:auto;overscroll-behavior:contain}.pkt{margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
.pkm .chip{padding:6px 14px;font-size:14px}
#pksel{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--blk);border:1px solid var(--blkbd);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pkadd{display:flex;gap:6px;margin-top:14px}.pkadd input{flex:1;min-width:0}.pkadd button{white-space:nowrap}
.nb.cur{border:2px solid var(--ac);background:var(--card);color:var(--tx);padding:8px 10px}
.nb.cur .nbh{color:var(--ac);font-weight:700}.nb.cur .nbh b{color:var(--tx)}
.nb.cur .edwrap{margin:6px 0 0}.nb.cur.closed .edwrap{display:none}
.nb.cur .curp{display:none;cursor:pointer;color:var(--sub);-webkit-mask-image:linear-gradient(to top,transparent,#000 60%);mask-image:linear-gradient(to top,transparent,#000 60%)}
.nb.cur.closed .curp{display:block}
.edwrap:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px #6c5ce722}
.eb textarea.actual-field{display:block;border:0;background:transparent;resize:none;overflow:hidden;min-height:42vh;font-family:var(--wf);font-size:var(--wsz);line-height:1.95;padding:16px 18px;outline:none;color:var(--tx)}
/* 앞·뒤 에피소드 미리보기 */
.nb{margin:8px 0;padding:8px 12px;border:1px dashed var(--blkbd);border-radius:12px;background:var(--blk);color:var(--sub)}
.nbh{display:flex;align-items:center;gap:8px;font-size:12px}.nbh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nbh b{color:var(--tx)}
.nbh button{border:0;background:none;color:var(--ac);padding:0 2px;font-size:12px;flex:none}

const safeText=(v,fallback="")=>{
 if(v==null)return fallback;
 if(typeof v==="string")return v;
 if(typeof v==="number"||typeof v==="boolean")return String(v);
 if(Array.isArray(v))return v.map(x=>safeText(x)).filter(Boolean).join(", ");
 if(typeof v==="object"){for(const k of ["name","title","label","text","value","displayName"]){if(v[k]!=null&&typeof v[k]!=="object")return String(v[k])}try{return JSON.stringify(v)}catch(e){return fallback}}
 return fallback;
};
const actName=(a,i)=>(safeText(a&&typeof a==="object"?(a.name??a.title??a.label??a.text):a,`${i+1}장`)||`${i+1}장`).replace(/^(\d+)\u0020?\ub9c9/,"$1장");
const setActs=arr=>{ACTS.splice(0,ACTS.length,...arr.map((a,i)=>actName(a,i)))};
const normalizeData=()=>{
 if(!D||typeof D!=="object")D={events:[],chars:[]};
 if(!Array.isArray(D.events))D.events=[];
 if(!Array.isArray(D.chars))D.chars=[];
 if(!Array.isArray(D.trash))D.trash=[];
 D.trash=D.trash.filter(t=>t&&t.o&&["events","chars","items"].includes(t.k));
 if(!Array.isArray(D.items)){const seen=new Set();D.items=[];D.events.forEach(e=>String(e&&e.items||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!seen.has(n)){seen.add(n);D.items.push({id:D.items.length+1,name:n,desc:"",owner:"",memo:""})}}))}
 D.items=D.items.map((c,i)=>{if(!c||typeof c!=="object")c={name:safeText(c)};["name","desc","owner","memo"].forEach(k=>{c[k]=safeText(c[k],"")});c.id=Number(c.id)||i+1;return c});
 if(Array.isArray(D.acts)&&D.acts.length)setActs(D.acts);
 D.acts=clone(ACTS);
 if(typeof D.title!=="string")D.title=safeText(D.title,"");
 const ef=["when","place","title","actual","chars","items","tags","memo"];
 D.events=D.events.map((e,i)=>{
  if(!e||typeof e!=="object")e={title:safeText(e)};
  ef.forEach(k=>{e[k]=safeText(e[k],"")});
  e.id=Number(e.id)||i+1;
  e.act=Math.min(Math.max(0,Number(e.act)||0),ACTS.length-1);
  delete e.summary;e.fs=!!e.fs;e.done=!!e.done;return e;
 });
 const cf=["name","aliases","role","age","look","personality","background","arc","relations","tags","memo"];
 D.chars=D.chars.map((c,i)=>{if(!c||typeof c!=="object")c={name:safeText(c)};cf.forEach(k=>{c[k]=safeText(c[k],"")});c.id=Number(c.id)||i+1;return c});
};

// ===== 꾹 눌러야 이동 가능 =====
// 손잡이(⠿)를 0.4초 이상 누르고 있으면 블럭이 부르르 떨리며 이동 상태가 된다. 그냥 스치거나 짧게 누르면 아무 일도 없다.
const HOLD_MS=400;let holdT=0,holdInfo=null,holdPass=false;
function holdClear(){clearTimeout(holdT);holdT=0;holdInfo=null}
document.addEventListener("pointerdown",ev=>{
 if(holdPass)return;
 const h=ev.target.closest&&ev.target.closest(".dh,.entity-handle,.ah");if(!h)return;
 ev.stopImmediatePropagation();ev.preventDefault();holdClear();
 const blk=h.classList.contains("dh")?h.closest(".card"):h.classList.contains("ah")?h.closest("h2"):h.closest(".entity-card");
 holdInfo={x:ev.clientX,y:ev.clientY,id:ev.pointerId};
 const init={bubbles:true,cancelable:true,composed:true,pointerId:ev.pointerId,pointerType:ev.pointerType,isPrimary:ev.isPrimary,clientX:ev.clientX,clientY:ev.clientY,button:ev.button,buttons:ev.buttons};
 holdT=setTimeout(()=>{
  holdT=0;holdInfo=null;if(!h.isConnected)return;
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  if(blk)blk.classList.add("wiggle"); // 이동용 복제본이 이 클래스를 물려받아 떨린다
  holdPass=true;try{h.dispatchEvent(new PointerEvent("pointerdown",init))}finally{holdPass=false}
  if(blk)blk.classList.remove("wiggle");
 },HOLD_MS);
},true);
document.addEventListener("pointermove",ev=>{if(holdInfo&&ev.pointerId===holdInfo.id&&Math.hypot(ev.clientX-holdInfo.x,ev.clientY-holdInfo.y)>10)holdClear()},true);
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,ev=>{if(holdInfo&&ev.pointerId===holdInfo.id)holdClear()},true));
document.addEventListener("contextmenu",ev=>{if(ev.target.closest&&ev.target.closest(".dh,.entity-handle,.ah"))ev.preventDefault()});

 const arr=D.events,i=arr.findIndex(x=>x.id===id);if(i<0)return;

 if(t.ref!=null){const j=arr.findIndex(x=>x.id===t.ref);at=j<0?arr.length:(t.before?j:j+1)}

// 한국어 음성 고르기: 여성(또는 기본) 음성을 우선하고, 이름으로 알 수 있는 남성 음성은 피한다.
function chooseReadingVoice(tries){
 if(tries>0)return {v:null,pitch:1};
 const voices=koreanVoices();
 if(!voices.length)return {v:null,pitch:1};
 const MALE=/\bmale\b|\bman\b|남성|남자|injoon|hyunsu|bongjin|gookmin|minsu|민수|철수|인준|현우/i;
 const FEM=/female|woman|여성|여자|유진|서연|선희|혜진|지민|heami|sunhi|yuna|google/i;
 const pref=a=>a.find(v=>/google|microsoft|samsung/i.test(v.name))||a[0];
 const nm=voices.filter(v=>!MALE.test(v.name)),pool=nm.length?nm:voices;
 const f=pool.filter(v=>FEM.test(v.name));
 return {v:pref(f.length?f:pool),pitch:1};
}
// 한 줄을 문장 단위(최대 약 140자)로 쪼갠다. startOffset은 그 줄 안에서의 위치.
function speechPieces(text,eventId,lineIndex){
 const raw=String(text??"");if(!raw.trim())return [];
 const out=[];let pos=0;
 while(pos<raw.length){
  while(pos<raw.length&&/\s/.test(raw[pos]))pos++;
  if(pos>=raw.length)break;
  let end=Math.min(raw.length,pos+140);
  if(end<raw.length){
   const seg=raw.slice(pos,end);let cut=-1;
   for(let i=0;i<seg.length;i++){
    if(/[.!?。！？…]/.test(seg[i])){let j=i;while(j+1<seg.length&&/["'”’」』)\]…]/.test(seg[j+1]))j++;if(j>=8&&(j===seg.length-1||/\s/.test(seg[j+1]))){cut=j;break}}
   }
   if(cut>=0)end=pos+cut+1;
   else{const sp=seg.lastIndexOf(" ");if(sp>=30)end=pos+sp}
  }
  const piece=raw.slice(pos,end).trimEnd();
  if(!piece)break;
  out.push({text:piece,eventId:String(eventId),lineIndex:String(lineIndex),startOffset:pos});
  pos+=piece.length;
 }
 return out;
}
function buildSpeechQueue(){

  String(e.actual||"").replace(/\r\n?/g,"\n").split("\n").forEach((line,li)=>speechPieces(line,e.id,li).forEach(p=>q.push(p)));
 });
 return q;
}

  if(co>eo||(co===eo&&cl>line))return {i,skip:0};

 }

function edScrollTo(ta,idx){

 const y=mirrorY(ta,idx),top=ta.getBoundingClientRect().top+y-b.getBoundingClientRect().top;
 if(top<b.clientHeight*.12||top>b.clientHeight*.72)b.scrollTop+=top-b.clientHeight*.35;
}
function edSpeakStart(){
 if(!speechOK()){speechFallback();return}
 const ta=fe("actual");if(!ta)return;
 stopSpeech();setCur(true);
 const text=ta.value;let from=ta.selectionStart,to=ta.selectionEnd;
 if(to<=from){from=to;to=text.length}
 const pieces=[];let pos=0;
 text.split("\n").forEach(line=>{
  speechPieces(line,0,0).forEach(pc=>{const a=pos+pc.startOffset,e=a+pc.text.length;if(e>from&&a<to)pieces.push({a:Math.max(a,from),e:Math.min(e,to)})});
  pos+=line.length+1;
 });
 if(!pieces.length){toast("읽을 내용이 없습니다.");return}
 const run=++eRun;ePlaying=true;ta.readOnly=true;edUI(); // 읽는 동안은 읽기 전용 → 모바일에서 키보드가 올라오지 않는다
 const next=(i,tries)=>{
  if(run!==eRun)return;
  if(i>=pieces.length){eEnd=pieces[pieces.length-1].e;edStop(true);return}
  const pc=pieces[i],{v,pitch}=chooseReadingVoice(tries||0);
  const u=new SpeechSynthesisUtterance(text.slice(pc.a,pc.e));
  if(v){u.voice=v;u.lang=v.lang}else u.lang="ko-KR";
  u.rate=sRate;u.pitch=pitch;eUt=u;let started=false;
  u.onstart=()=>{if(run!==eRun)return;started=true;clearTimeout(eWatch);eEnd=pc.a;try{ta.focus({preventScroll:true});ta.setSelectionRange(pc.a,pc.e)}catch(e){}edScrollTo(ta,pc.a)};
  u.onend=()=>{if(run===eRun)next(i+1,0)};
  u.onerror=ev=>{if(run!==eRun)return;if(ev&&(ev.error==="interrupted"||ev.error==="canceled"))return;next(i+1,0)};
  clearTimeout(eWatch);
  eWatch=setTimeout(()=>{if(run!==eRun||started)return;speechSynthesis.cancel();if((tries||0)<1)setTimeout(()=>next(i,1),120);else{edStop();if(isChrome())toast("음성을 재생하지 못했습니다.",2600);else speechFallback()}},4000);
  speechSynthesis.speak(u);
 };
 speechSynthesis.cancel();
 setTimeout(()=>{if(run===eRun)next(0,0)},90);
}

function nvCaretNow(){
 const sel=getSelection();if(!sel||!sel.rangeCount)return null;
 const r=sel.getRangeAt(0),nb=$("nbody");if(!nb.contains(r.startContainer))return null;
 let sc=r.startContainer,so=r.startOffset;
 if(sc.nodeType===1&&sc.childNodes[so]){sc=sc.childNodes[so];so=0}
 let el=sc.nodeType===1?sc:sc.parentElement;
 let nl=el&&el.closest(".nl");if(!nl){const f=el&&el.querySelector&&el.querySelector(".nl");if(!f)return null;nl=f}
 const lt=nl.querySelector(".lt");let off=0;
 if(lt&&lt.contains(sc)){const pre=document.createRange();pre.selectNodeContents(lt);pre.setEnd(sc,so);off=pre.toString().length}
 if(!sel.isCollapsed&&lt&&off>0&&off>=lt.textContent.length&&nl.nextElementSibling&&nl.nextElementSibling.classList.contains("nl")){nl=nl.nextElementSibling;off=0}

async function fbInit(persist){
 if(FB)return FB;
 const [appM,authM,fs]=await Promise.all([import(FBU("app")),import(FBU("auth")),import(FBU("firestore"))]);
 const app=appM.initializeApp(FBCFG);let db;
 if(persist){try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}}
 else db=fs.getFirestore(app);
 FB={app,db,fs,au:authM,auth:authM.getAuth(app)};return FB;
}
function fbErrText(e){
 const c=e&&e.code||"";
 if(c==="permission-denied")return "권한 없음 (허용된 구글 계정인지, 보안 규칙을 게시했는지 확인)";
 if(c==="unavailable")return "서버에 연결할 수 없음";
 return (e&&e.message)||"알 수 없는 오류";
}
function fbStatus(){
 const b=$("fbst");if(!FBON||SHARE){b.hidden=true;return}
 b.hidden=false;const w=$("who");
 if(fbUser){const den=/권한 없음/.test(fbErr),adm=!den&&fbGot.size>=4;w.hidden=false;w.className="rolechip "+(adm?"adm":"usr");w.textContent=`${fbUser.email||"로그인됨"} · ${den?"👤 사용자":adm?"🛠 관리자":"확인 중…"}`}else w.hidden=true;
 let t;
 if(!fbUser)t="🔑 구글 로그인";
 else if(fbErr)t="☁ ⚠ "+fbErr;
 else if(fbGot.size<4)t="☁ 불러오는 중…";
 else{
  const pend=COLS.some(k=>SNAP[k]&&SNAP[k].metadata.hasPendingWrites)||(SNAP.meta&&SNAP.meta.metadata.hasPendingWrites);
  t=fbTimer?"☁ 저장 중…":pend?(navigator.onLine?"☁ 저장 중…":"☁ 오프라인 · 반영 대기"):"☁ 동기화됨";
 }
 b.textContent=t;b.classList.toggle("p",!fbUser);
 b.title=fbUser?`${fbUser.email||""} · 클릭하면 로그아웃`:"구글 계정으로 로그인하면 PC·모바일이 같은 데이터를 씁니다";
}
window.fbHook=()=>{if(!FBON||SHARE)return;clearTimeout(fbTimer);fbTimer=setTimeout(fbFlush,1200);fbStatus()};
function fbUniqueIds(){
 COLS.forEach(k=>{const seen=new Set();let mx=Math.max(0,...D[k].map(x=>+x.id||0));D[k].forEach(o=>{if(seen.has(o.id))o.id=++mx;seen.add(o.id)})});
}
function fbFlush(){fbFlushMain();fbSyncPub()}
function fbFlushMain(){
 fbTimer=null;
 if(!fbUser||!FB)return fbStatus();
 if(!fbBased||fbGot.size<4){fbTimer=setTimeout(fbFlush,800);return}
 fbUniqueIds();
 const {db,fs}=FB,writes=[],ordOnly=[],seen=new Set();
 COLS.forEach(k=>D[k].forEach((o,i)=>{
  const key=k+"/"+o.id;seen.add(key);
  const data=JSON.parse(JSON.stringify(o)),s=stable(data),b=BASE.get(key);
  if(!b||b.s!==s)writes.push({key,ref:fs.doc(db,k,String(o.id)),data:{...data,ord:i},s,ord:i});
  else if(b.ord!==i)ordOnly.push({key,ref:fs.doc(db,k,String(o.id)),ord:i,s});
 }));
 D.trash.forEach(t=>{
  const id="t"+t.at+"_"+t.o.id,key=t.k+"/"+id;seen.add(key);
  const data={...JSON.parse(JSON.stringify(t.o)),_tr:t.at},s=stable(data),b=BASE.get(key);
  if(!b||b.s!==s)writes.push({key,ref:fs.doc(db,t.k,id),data,s,ord:undefined});
 });
 const dels=[];BASE.forEach((b,key)=>{if(key!=="meta"&&!seen.has(key)){const [k,id]=key.split("/");dels.push({key,ref:fs.doc(db,k,id)})}});
 const meta={title:D.title||"",acts:ACTS.slice()},ms=stable(meta),mb=BASE.get("meta");
 const metaChanged=!mb||mb.s!==ms;
 if(!writes.length&&!ordOnly.length&&!dels.length&&!metaChanged)return fbStatus();
 const ops=[...writes.map(w=>({t:"s",ref:w.ref,data:w.data})),...ordOnly.map(w=>({t:"m",ref:w.ref,data:{ord:w.ord}})),...dels.map(d=>({t:"d",ref:d.ref}))];
 if(metaChanged)ops.push({t:"s",ref:fs.doc(db,"meta","main"),data:meta});
 for(let i=0;i<ops.length;i+=400){
  const b=fs.writeBatch(db);
  ops.slice(i,i+400).forEach(o=>o.t==="s"?b.set(o.ref,o.data):o.t==="m"?b.set(o.ref,o.data,{merge:true}):b.delete(o.ref));
  b.commit().catch(e=>{fbErr=fbErrText(e);BASE.clear();fbStatus()});
 }
 writes.forEach(w=>BASE.set(w.key,{s:w.s,ord:w.ord}));ordOnly.forEach(w=>BASE.set(w.key,{s:w.s,ord:w.ord}));dels.forEach(d=>BASE.delete(d.key));BASE.set("meta",{s:ms});
 fbStatus();
}
function fbApply(first){
 const docs=k=>SNAP[k].docs.map(d=>d.data());
 const isTr=o=>o&&o._tr!=null,trs=[];COLS.forEach(k=>SNAP[k].docs.forEach(d=>{const o=d.data();if(isTr(o)){const c={...o};delete c._tr;delete c.ord;trs.push({k,at:o._tr,o:c,key:k+"/"+d.id})}}));
 const evs=docs("events").filter(o=>!isTr(o)),chs=docs("chars").filter(o=>!isTr(o)),its=docs("items").filter(o=>!isTr(o)),meta=SNAP.meta.exists()?SNAP.meta.data():null;
 if(!evs.length&&!chs.length&&!its.length&&!trs.length&&!meta){
  D={title:DEFTITLE,acts:ACTS.slice(),events:[],chars:[],items:[],trash:[],_tagsRemoved:true};
  normalizeData();
  BASE=new Map();
  BASE.set("meta",{s:stable({title:D.title||"",acts:ACTS.slice()})});
  fbBased=true;
  fillActFilter();render();cacheLocal();
  return;
 }
 const sig=()=>stable({t:D.title,a:ACTS,e:D.events,c:D.chars,i:D.items,r:D.trash});
 const before=sig();
 if(first){try{localStorage.setItem("novel-backup-before-sync",JSON.stringify(D))}catch(e){}}
 const ord=a=>a.slice().sort((x,y)=>(x.ord??1e9)-(y.ord??1e9)).map(o=>{const c={...o};delete c.ord;return c});
 D={title:meta&&meta.title||"",acts:meta&&Array.isArray(meta.acts)&&meta.acts.length?meta.acts:ACTS.slice(),events:ord(evs),chars:ord(chs),items:ord(its),trash:trs.map(t=>({k:t.k,at:t.at,o:t.o})),_tagsRemoved:true};
 normalizeData();
 BASE=new Map();const ordOf={};
 COLS.forEach(k=>SNAP[k].docs.forEach(d=>{ordOf[k+"/"+d.id]=d.data().ord}));
 COLS.forEach(k=>D[k].forEach(o=>BASE.set(k+"/"+o.id,{s:stable(JSON.parse(JSON.stringify(o))),ord:ordOf[k+"/"+o.id]})));
 trs.forEach(t=>{const tt=D.trash.find(x=>x.k===t.k&&x.at===t.at);if(tt)BASE.set(t.key,{s:stable(JSON.parse(JSON.stringify({...tt.o,_tr:tt.at}))),ord:undefined,tr:1})});
 if(meta)BASE.set("meta",{s:stable({title:D.title||"",acts:ACTS.slice()})});
 let stale=false;SNAP.events.docs.forEach(d=>{if("summary" in d.data()){stale=true;BASE.set("events/"+d.id,{s:"",ord:ordOf["events/"+d.id]})}});
 fbBased=true;
 if(stale){clearTimeout(fbTimer);fbTimer=setTimeout(fbFlush,800)}
 if(before!==sig()){fillActFilter();render();cacheLocal()}
}
function fbOnSnap(){
 if(fbGot.size<4)return;
 fbErr="";
 if(!fbBased)fbApply(true);
 else if(!fbTimer)fbApply(false);
 if(!fbTimer)fbSyncPub();
 if(fbBased){
  if(isAdminNow()){document.body.classList.remove("booting");document.body.classList.add("adminready")}
  connDone();
  // 로그인 직후 소설 보기 창이 열려 있다면 관리자 데이터가 도착한 화면으로 갱신
  if($("ndlg").open){const st=$("nbody").scrollTop;renderNovel();$("nbody").scrollTop=st}
 }
 fbStatus();
}
function fbListen(){
 fbUnlisten();const {db,fs}=FB;
 const onErr=e=>{fbErr=fbErrText(e);connDone();fbStatus()};
 COLS.forEach(k=>fbUnsub.push(fs.onSnapshot(fs.collection(db,k),{includeMetadataChanges:true},s=>{SNAP[k]=s;fbGot.add(k);fbOnSnap()},onErr)));
 fbUnsub.push(fs.onSnapshot(fs.doc(db,"meta","main"),{includeMetadataChanges:true},s=>{SNAP.meta=s;fbGot.add("meta");fbOnSnap()},onErr));
 fbUnsub.push(fs.onSnapshot(fs.collection(db,"pubEvents"),s=>{PUBMAP=new Map(s.docs.map(d=>[d.id,stable(d.data())]));PUBGOT=true;if(!fbTimer)fbSyncPub()},()=>{}));
}
function fbUnlisten(){fbUnsub.forEach(f=>{try{f()}catch(e){}});fbUnsub=[];SNAP={};fbGot=new Set();fbBased=false;fbAsked=false;BASE=new Map();PUBMAP=new Map();PUBGOT=false;PUBMETAS=""}
async function fbLogin(){
 const {au,auth}=FB,provider=new au.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
 try{await au.signInWithPopup(auth,provider)}
 catch(e){
  const c=e&&e.code||"";
  if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){try{await au.signInWithRedirect(auth,provider)}catch(e2){alert("로그인 실패: "+(e2.message||e2))}}
  else if(c==="auth/unauthorized-domain")alert("이 주소가 Firebase에 등록되지 않았습니다.\nFirebase 콘솔 → Authentication → 설정 → 승인된 도메인에\n"+location.hostname+" 을(를) 추가하세요.");
  else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")alert("로그인 실패: "+(e.message||c));
 }
}
function fbSyncPub(){
 if(SHARE||!FB||!fbUser||!fbBased||!PUBGOT)return;
 const {db,fs}=FB,want=new Map(),ops=[];
 D.events.forEach((e,i)=>{if(e.done)want.set(String(e.id),{id:e.id,act:+e.act||0,title:e.title||"",actual:String(e.actual||""),ord:i})});
 want.forEach((d,id)=>{if(PUBMAP.get(id)!==stable(d))ops.push({t:"s",ref:fs.doc(db,"pubEvents",id),data:d})});
 PUBMAP.forEach((v,id)=>{if(!want.has(id))ops.push({t:"d",ref:fs.doc(db,"pubEvents",id)})});
 const meta={title:D.title||"",acts:ACTS.slice()},ms=want.size?stable(meta):"";
 if(want.size&&ms!==PUBMETAS)ops.push({t:"s",ref:fs.doc(db,"pubMeta","main"),data:{...meta,updatedAt:Date.now()}});
 if(!want.size&&PUBMAP.size)ops.push({t:"d",ref:fs.doc(db,"pubMeta","main")});
 if(!ops.length)return;
 PUBMETAS=ms;
 want.forEach((d,id)=>PUBMAP.set(id,stable(d)));[...PUBMAP.keys()].forEach(id=>{if(!want.has(id))PUBMAP.delete(id)});
 for(let i=0;i<ops.length;i+=400){const wb=fs.writeBatch(db);ops.slice(i,i+400).forEach(o=>o.t==="s"?wb.set(o.ref,o.data):wb.delete(o.ref));wb.commit().catch(e=>{PUBGOT=false;fbErr="공개 반영 실패: "+fbErrText(e);fbStatus()})}
}
async function fbStart(){
 fbStatus();
 try{await fbInit(true)}catch(e){fbErr="Firebase를 불러오지 못했습니다 (인터넷 확인)";connDone();fbStatus();return}
 $("fbst").onclick=async()=>{if(fbUser){if(confirm(`${fbUser.email||"계정"} 에서 로그아웃할까요?\n(서버 동기화만 멈춥니다.)`))await FB.au.signOut(FB.auth)}else await fbLogin()};
 window.addEventListener("online",fbStatus);window.addEventListener("offline",fbStatus);
 window.addEventListener("beforeunload",ev=>{if(fbTimer){ev.preventDefault();ev.returnValue=""}});
 FB.au.onAuthStateChanged(FB.auth,u=>{
  fbUser=u;fbErr="";
  if(u){
   PUB=false;NVUSER=false;
   ldShow("불러오기");document.body.classList.add("connecting");
   fbListen();
  }else{
   document.body.classList.remove("adminready");document.body.classList.add("booting");
   connDone();
   fbUnlisten();
   if(!SHARE){
    PUB=true;NVUSER=true;
    fbShare();
   }
  }
  fbStatus();
 });
}
async function fbShare(){
 ldShow("불러오는 중…");
 try{
  await fbInit(false);const {db,fs}=FB;
  const [m,es]=await Promise.all([fs.getDoc(fs.doc(db,"pubMeta","main")),fs.getDocs(fs.collection(db,"pubEvents"))]);
  if(!m.exists()&&es.empty){shareFail("아직 공개된 내용이 없습니다.");return}
  const mm=m.exists()?m.data():{};
  const evs=es.docs.map(d=>d.data()).sort((a,b)=>(a.ord??0)-(b.ord??0)).map(({ord,...r})=>r);
  D={title:mm.title||"",acts:Array.isArray(mm.acts)?mm.acts:[],events:evs,chars:[],items:[]};
  normalizeData();fillActFilter();ldHide();
 }catch(e){shareFail("소설 데이터를 불러오지 못했습니다. ("+fbErrText(e)+")");return}
 shareShow();
}
if(SHARE){
 normalizeData();fillActFilter();
 if(FBON)fbShare();else shareLoad();
}else{
 if(FBON){
  D={title:DEFTITLE,acts:clone(ACTS),events:[],chars:[],items:[]};
  normalizeData();fillActFilter();connShow();
  PUB=true;NVUSER=true;
  fbStart();
 }else{
  document.body.classList.remove("booting");document.body.classList.add("adminready");
  render();
 }
}
</script>
