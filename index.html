<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소설 관리</title>
<script>(function(){try{var m=localStorage.getItem("novel-theme")||"auto";var d=m==="dark"||(m==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light")}catch(e){}})()</script>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--blk:#ece8ff;--blkbd:#c9c0f7;--tx:#1f2330;--sub:#6a7083;--bd:#d5d9e3;--ac:#6c5ce7;--fs:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Pretendard","Noto Sans KR",system-ui,sans-serif}
header{display:flex;flex-wrap:nowrap;align-items:baseline;gap:12px;padding:10px 16px 2px;width:100%;overflow:hidden}
h1{margin:0;font-size:20px;border-bottom:1px dashed transparent;cursor:text;outline:none;min-width:40px;white-space:nowrap;flex:none}
h1:hover{border-bottom-color:var(--bd)}h1:focus{border-bottom-color:var(--ac)}
#sub{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stat{color:var(--sub);font-size:12px;white-space:nowrap;flex:none}
.ah{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 6px 0 0;font-size:15px}
.tree-act.dabefore{box-shadow:-4px 0 0 0 var(--ac)}
.tree-act.daafter{box-shadow:4px 0 0 0 var(--ac)}
.tree-act.dragact{opacity:.35}
.bar{position:sticky;top:0;background:var(--bg);z-index:20;width:100%;padding:8px 16px;border-bottom:1px solid var(--bd);box-shadow:0 4px 12px #0001}.bar.collapsed .row:not(:first-child){display:none}.bar.collapsed{padding-bottom:6px}.menu-toggle{white-space:nowrap}
/* 소설 내용 보기 버튼은 레이아웃 공간을 차지하지 않고 화면 우측 하단에 떠 있도록 배치 */
#viewNovel.novel-fab{position:fixed;right:14px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;margin:0;padding:9px 14px;border:1px solid #6c5ce766;border-radius:999px;background:rgba(108,92,231,.72);color:#fff;box-shadow:0 4px 16px #0002;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.82;transition:opacity .15s,background .15s}
#viewNovel.novel-fab:hover,#viewNovel.novel-fab:focus-visible{opacity:1;background:rgba(108,92,231,.96)}
body.share #viewNovel{display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;align-items:center}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.warn{border-color:var(--fs);color:var(--fs);background:#e5484d14}button.warn:hover{background:var(--fs);color:#fff;border-color:var(--fs)}
#q{flex:1;min-width:140px}.chip{border-radius:99px;padding:1px 10px;font-size:12px}
.tab{font-weight:700;border:none;border-bottom:3px solid transparent;border-radius:0;background:none}.tab.on{color:var(--ac);background:none;border-bottom-color:var(--ac)}
main{width:100%;padding:12px 16px 60px}
.pl{color:var(--sub);font-size:13px}
.act{margin:26px 0 6px;font-weight:700;color:var(--ac);border-bottom:2px solid var(--ac)}
.ev{display:grid;grid-template-columns:90px 1fr;gap:12px;margin:10px 0}
.when{text-align:right;font-weight:700;padding-top:12px}.when small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.card{background:var(--blk);border:1px solid var(--blkbd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 14px}
.card.fs{background:#ffeceb;border-color:#f6c3c5;border-left-color:var(--fs)}.card.done{background:#e4f7ec;border-color:#b5e3c9;outline:2px solid #55c89a;outline-offset:1px}.card h3{margin:0;font-size:16px}
.card p{margin:6px 0;white-space:pre-wrap}.tags span{display:inline-block;background:#ffffffb0;border-radius:6px;padding:0 7px;margin:2px 4px 2px 0;font-size:12px}
.tags .it{background:none;border:1px dashed #a79ef0;color:var(--sub);cursor:pointer}.tags .it:hover{color:var(--ac);border-color:var(--ac)}.tags .tg{background:none;color:var(--ac);cursor:pointer}.tags .nm{cursor:pointer}
.memo{border-top:1px dashed var(--blkbd);margin-top:6px;padding-top:4px;color:var(--sub);font-size:13px}.memo p{white-space:pre-wrap;max-height:420px;overflow:auto}textarea.actual-field{min-height:260px;border:2px solid var(--ac);background:#faf9ff}
.btns{display:flex;gap:2px;margin:-2px 0 4px -4px}.btns button{padding:2px 6px;font-size:13px;border:none;background:none;color:var(--sub)}
.dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ac)!important;font-size:16px!important;padding:0 8px!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* 최초 로딩 프로그래스바 */
#ld{position:fixed;left:0;right:0;top:0;z-index:300;display:none}
#ld .t{height:4px;background:#0002}
#ld .b{height:100%;width:0;background:var(--ac);transition:width .25s}
#ld .m{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px 14px;font-size:12px;color:var(--sub);white-space:nowrap}

/* 라인트리 */
.tree-wrap{overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}
.tree{display:flex;align-items:stretch;gap:18px;min-width:max-content;min-height:100%;padding:16px 12px 24px}
.tree-act{width:300px;flex:0 0 300px;position:relative;padding-top:0;border-radius:10px}
.acthd{position:sticky;top:0;z-index:6;height:28px;background:var(--bg)}.acthd:before{content:"";position:absolute;top:12px;left:-18px;right:-18px;height:2px;background:var(--ac);opacity:.55}.tree-act:first-child .acthd:before{left:0}
.tree-act h2{position:absolute;top:0;left:0;margin:0;padding:2px 10px;background:var(--ac);color:#fff;border-radius:7px;font-size:13px;max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node{position:relative;margin:12px 0;padding-left:15px;border-radius:8px}
.tree-node:before{content:"";position:absolute;left:0;top:-12px;bottom:-12px;width:2px;background:var(--bd)}
.tree-node:after{content:"";position:absolute;left:0;top:18px;width:12px;height:2px;background:var(--ac)}
.tree-node:last-child:before{bottom:calc(100% - 20px)}
.tree-node .ev{grid-template-columns:60px 1fr;gap:8px;margin:0}
.tree-node .card{padding:9px 10px}.tree-node .card p{font-size:13px;max-height:150px;overflow:auto}.tree-node .card>p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;max-height:none;text-overflow:ellipsis}
.tree-insert{display:flex;align-items:center;gap:6px;margin:0 0 10px 15px;color:var(--sub);font-size:12px}
.tree-insert:before,.tree-insert:after{content:"";height:1px;background:var(--bd);flex:1}
.tree-insert button{font-size:12px;padding:3px 9px;border-style:dashed;color:var(--ac);white-space:nowrap}
.insert-slot{display:flex;align-items:center;gap:8px;margin:0 0 8px 102px;color:var(--sub);font-size:12px}
.insert-slot:before,.insert-slot:after{content:"";height:1px;background:var(--bd);flex:1}
.insert-slot button{font-size:12px;padding:3px 9px;border-style:dashed;color:var(--ac);white-space:nowrap}
.danger{color:var(--fs)!important}
.clk{cursor:pointer}h3.clk:hover{color:var(--ac)}p.clk:hover{background:#6c5ce712;border-radius:6px}
/* 소설 내용 보기 */
.nv-h{margin:22px 0 4px;font-size:18px;font-weight:700;color:var(--ac)}.nv-b{white-space:pre-wrap;line-height:1.9;font-size:16px}.nv-empty{color:var(--sub)}
.nvbtn{margin:6px 0;font-size:13px;padding:3px 10px;color:var(--ac);border-style:dashed}
.nl.flash{animation:nvflash 1.6s ease-out}@keyframes nvflash{0%,40%{background:#6c5ce740}100%{background:transparent}}
.nv-code{margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:#f6f4ff;padding:8px 0;font-size:15px;line-height:1.8}
.nl{display:flex;align-items:flex-start}.nl:hover{background:#6c5ce70d}
/* 소설 내용 보기 안의 복사/공유 버튼: 레이아웃 공간을 차지하지 않고 우측 하단에 고정 */
#novelFloatActions{position:fixed;right:14px;bottom:max(10px,env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:calc(100vw - 28px);pointer-events:none}
#novelFloatActions button{pointer-events:auto;font-size:13px;padding:8px 11px;border:1px solid #6c5ce766;border-radius:999px;background:rgba(255,255,255,.78);color:var(--ac);box-shadow:0 4px 16px #0002;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.84;transition:opacity .15s,background .15s}
#novelFloatActions button:hover,#novelFloatActions button:focus-visible{opacity:1;background:rgba(255,255,255,.97)}
#novelFloatActions.actions-hidden #nview,#novelFloatActions.actions-hidden #ncopy,#novelFloatActions.actions-hidden #nlink,#novelFloatActions.actions-hidden #nclose{display:none!important}
#novelMenuToggle{font-weight:700!important;background:rgba(255,255,255,.95)!important}
#ndlg #nhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
#ndlg #nbody{padding-bottom:0}#ndlg form{padding-bottom:0;min-height:0}
.nacts{flex-wrap:nowrap!important;overflow-x:auto;align-items:center;scrollbar-width:thin}.nacts.menu-hidden{display:none!important}#nmenuToggle{width:100%;text-align:left;margin:6px 0 2px;font-size:14px;padding:8px 12px;border-radius:8px} @media(max-width:600px){#ndlg{width:96vw;max-width:96vw;padding:12px}#ndlg #nhead h3{font-size:17px}#ndlg #nbody{font-size:15px}#nmenuToggle{position:sticky;top:0;z-index:5;background:var(--card)}}.nacts button{white-space:nowrap;flex:none}.nacts .arr{color:var(--sub);flex:none;font-size:13px}

#neventnav:empty{display:none}#neventnav{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card)}.neventnav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.neventnav-label{font-size:12px;color:var(--sub);font-weight:700}.nevent-layout-toggle{font-size:12px;padding:4px 9px;white-space:nowrap}.neventnav-links{display:flex;flex-wrap:wrap;gap:6px}.neventnav-links.horizontal{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.novel-event-link{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--blk);border-color:var(--blkbd);white-space:normal;text-align:left;flex:0 0 auto}
.novel-edge-scroll{position:fixed;z-index:110;border:1px solid #6c5ce766;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ac);font-size:13px;font-weight:700;padding:8px 12px;box-shadow:0 4px 16px #0002;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.novel-edge-scroll.top{top:12%;left:50%;right:auto;transform:translate(-50%,-50%)}.novel-edge-scroll.bottom{top:78%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%)}

.st{font-size:15px;margin-right:3px;cursor:pointer;flex:none;user-select:none;-webkit-user-select:none}
.pill{padding:8px 14px!important;font-size:14px;border:1px solid #6c5ce766!important;border-radius:999px!important;background:rgba(255,255,255,.78)!important;color:var(--ac)!important;box-shadow:0 4px 16px #0002;opacity:.9}
.pill:hover,.pill:focus-visible{opacity:1;background:rgba(255,255,255,.97)!important}
.rolechip{font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--bd);white-space:nowrap}.rolechip.adm{background:#ece8ff;color:var(--ac);border-color:#c9c0f7}.rolechip.usr{background:#e4f7ec;color:#1f7a50;border-color:#b5e3c9}
body.share #nview{display:none}
.pkrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pkrow .pk{font-size:14px;padding:4px 12px}.pkadd{display:flex;gap:6px;align-items:center;margin:2px 0 6px}
.story-pickers{display:flex;flex-direction:column;gap:5px;margin:8px 0 12px;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--card)}.story-pickers>label{font-size:13px;font-weight:700;margin-top:3px}.story-pickers>input{width:100%;min-width:0}.story-pickers .pkrow{margin:2px 0 7px}
.pkadd input{flex:1 1 auto;min-width:0;width:auto!important}.pkadd button{flex:none;white-space:nowrap;padding:9px 14px;font-size:15px}
.card p.onel,.tree-node .card>p.onel{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:none;-webkit-line-clamp:unset;line-clamp:unset}
/* 떠 있는 버튼은 모두 우측 하단에 세로로 쌓는다 */
#add{position:fixed;right:14px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px);z-index:40;margin:0}
dialog form{padding-bottom:170px}
dialog .row.dacts{position:fixed;right:14px;bottom:max(10px,env(safe-area-inset-bottom));left:auto;top:auto;margin:0!important;padding:0;background:none;flex-direction:column;align-items:flex-end;flex-wrap:nowrap;gap:6px;z-index:100;width:auto}
dialog .row.dacts>span{display:none}
/* 카드가 칸(막 열)을 넘지 않도록: 그리드/플렉스 아이템의 최소 폭 제한을 풀고 넘치는 글은 ...으로 줄임 */
.ev>*,.tree-node,.tree-act{min-width:0}
.ev .card{max-width:100%;overflow-wrap:anywhere}
.card h3,.card .pl{max-width:100%}
.card h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pl:not(.onel){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{max-width:100%}.tags span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.fgrid .fld{min-width:0}.fgrid .w{grid-column:1/-1}
dialog textarea:not(.actual-field){min-height:0;resize:vertical}
.aclist{max-width:760px}.acrow{display:flex;align-items:center;gap:8px;margin:8px 0;padding:8px 12px;flex-wrap:nowrap}
.acrow input{flex:1 1 auto;min-width:0;font-weight:700}.acrow button{flex:none;padding:4px 10px}.acrow .pl{white-space:nowrap;flex:none}
.btns{flex-wrap:nowrap;align-items:center}.btns button{white-space:nowrap}.btns .st{margin-left:4px}
body.share header,body.share .bar,body.share main,body.share #nclose{display:none}
.nacts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.nacts button{font-size:13px;padding:4px 12px;font-weight:700}.nacts button small{font-weight:400;opacity:.8;margin-left:3px}
.nl .ln{flex:none;width:var(--w);box-sizing:content-box;text-align:right;padding:0 12px 0 10px;margin-right:12px;border-right:1px solid var(--bd);color:#9aa0b3;font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;user-select:none;-webkit-user-select:none}
.nl .lt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding-right:12px}
.nl.nh .lt{font-weight:700;color:var(--ac)}
/* 실제 내용 입력창 도구 */
.acthead{display:flex;align-items:center;justify-content:space-between}
.fsoff{display:none}
.insbar{margin:4px 0}.insdet{margin:4px 0}.insdet summary{cursor:pointer;font-size:14px;color:var(--sub);padding:2px 0;user-select:none}.insdet summary:hover{color:var(--ac)}.insrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.insrow .ins{padding:3px 10px;font-size:13px;font-weight:700}
.actbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.pick{width:auto;max-width:220px;padding:8px 10px;font-size:14px}
.actwrap.fs{position:fixed;inset:0;z-index:50;background:var(--bg);padding:10px 14px;display:flex;flex-direction:column}
.actwrap.fs .acthead label{margin:0}
.actwrap.fs .fsoff{display:inline-block;font-size:14px;padding:5px 12px}
.actwrap.fs textarea.actual-field{flex:1;min-height:0!important;resize:none;margin-top:6px}
.actwrap.fs .actbar{display:none}

/* 트리 보기: 화면 전체 채우기 */
body.treeview{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.treeview header,body.treeview .bar{flex:none}
body.treeview main{flex:1;min-height:0;padding:0}
body.treeview .tree-wrap{height:100%}

/* 드래그 */
.ev.dragging{opacity:.3}
.ghost{box-shadow:0 10px 30px #0004}
.tree-node.dbefore{box-shadow:0 -3px 0 0 var(--ac)}
.tree-node.dafter{box-shadow:0 3px 0 0 var(--ac)}
.tree-act.dcol{background:#6c5ce718;outline:2px dashed var(--ac);outline-offset:2px}

.kv{font-size:13px;margin:3px 0;white-space:pre-wrap}.kv b{color:var(--ac);margin-right:6px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
dialog{border:1px solid var(--bd);border-radius:0;background:var(--bg);color:var(--tx);width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:20px 24px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog form{width:100%;max-width:none;min-height:100%;display:flex;flex-direction:column}dialog form h3{font-size:21px;margin-bottom:12px!important}dialog label{display:block;font-size:14px;color:var(--sub);margin-top:12px}dialog input:not([type=checkbox]),dialog textarea,dialog select{width:100%;padding:10px 12px;font-size:16px}dialog textarea{min-height:110px;resize:vertical}dialog textarea.actual-field{min-height:45vh}dialog .row{margin-top:auto;padding-top:18px;position:sticky;bottom:0;background:var(--bg)}#tagbar{display:none!important}
@media(max-width:560px){header{padding:8px 12px 2px}h1{font-size:18px}.bar{padding:8px 10px}.bar .row{gap:5px}main{padding:10px 10px 40px}.ev{grid-template-columns:1fr;gap:4px}.when{text-align:left;padding:0}.grid{grid-template-columns:1fr}dialog{padding:14px 12px}.tree-act{width:270px;flex-basis:270px}.tree-node .ev{grid-template-columns:1fr}.tree-node .when{text-align:left;padding:0}body.treeview main{padding:0}}
/* 메뉴 탭: 타임라인·인물설정·아이템설정·막 설정이 완전히 같은 모양 */
.bar .row>.tab{padding:5px 12px;font-weight:700;border:none;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--tx)}
.bar .row>.tab.on{color:var(--ac);border-bottom-color:var(--ac);background:none}
/* 카드 공통 다듬기 */
.card{border-radius:12px;box-shadow:0 1px 3px #0000001a}
/* ===== 다크 테마 ===== */
:root[data-theme=dark]{--bg:#10121a;--card:#1a1d2b;--blk:#232848;--blkbd:#454c85;--tx:#e9ebf5;--sub:#9ba2bc;--bd:#2d3248;--ac:#8d7fff;--fs:#ff6d73}
:root[data-theme=dark] .bar{box-shadow:0 4px 14px #0008}
/* 사건 카드: 배경보다 확실히 밝은 면 + 굵은 왼쪽 강조선 + 은은한 광택 */
:root[data-theme=dark] .card{background:linear-gradient(135deg,#2c3262 0%,#222750 100%);border-color:#4b539a;border-left:5px solid var(--ac);box-shadow:0 4px 18px #0009,inset 0 1px 0 #ffffff14}
:root[data-theme=dark] .card.fs{background:linear-gradient(135deg,#4a2436 0%,#341a28 100%);border-color:#8a3f56;border-left-color:#ff6d73}
:root[data-theme=dark] .card.done{background:linear-gradient(135deg,#1f4a40 0%,#173a33 100%);border-color:#2f8a70;border-left-color:#3fd6a0;outline:2px solid #3fd6a066;outline-offset:1px}
:root[data-theme=dark] .card h3{color:#fff;font-size:17px;letter-spacing:.2px}
:root[data-theme=dark] .card p{color:#d6d9ea}
:root[data-theme=dark] .pl{color:#a9b0ca}
:root[data-theme=dark] .tags span{background:#ffffff1c;color:#eef0fa}
:root[data-theme=dark] .tags .it{background:none;border-color:#7d74d6;color:#b9b3ee}
:root[data-theme=dark] .tags .tg{background:none;color:#a99fff}
:root[data-theme=dark] .memo{border-top-color:#ffffff26;color:#b4bad3}
:root[data-theme=dark] .btns button{color:#c5cae6}
:root[data-theme=dark] .when{color:#f1f2fa}.when small{color:#9ba2bc}
:root[data-theme=dark] .nvbtn{color:#b4aaff;border-color:#8d7fff}
:root[data-theme=dark] .tree-node:before{background:#3a4060}
:root[data-theme=dark] textarea.actual-field{background:#171a28;border-color:var(--ac)}
:root[data-theme=dark] .nv-code{background:#171a28}

<body>
<div id="ld"><div class="t"><div class="b" id="ldb"></div></div><div class="m" id="ldm">data.json 불러오는 중…</div></div>
<header><h1 id="ttl" contenteditable="true" spellcheck="false" title="클릭해서 제목 수정"></h1><span class="pl" id="sub">수정본 · 사건 편집창에 ‘실제 내용 (소설 원문)’ 입력란 포함</span><span id="stat"></span><button id="themeBtn" type="button" style="flex:none;font-size:12px;padding:2px 10px;white-space:nowrap" title="화면 테마 선택 (자동 → 라이트 → 다크)"></button><span id="who" class="rolechip" hidden style="flex:none"></span><button id="fbst" hidden style="flex:none;font-size:12px;padding:2px 10px;white-space:nowrap"></button></header>
<div class="bar">
 <div class="row"><button class="tab on" data-tab="tl">타임라인</button><button class="tab" data-tab="ch">인물설정</button><button class="tab" data-tab="it">아이템설정</button><button class="tab" data-tab="ac">막설정</button>
 <span style="flex:1"></span><button class="menu-toggle" id="menuToggle" aria-expanded="true">⌃ 메뉴 접기</button><button class="pill" id="add">+ 추가</button></div>
 <div class="row"><input id="q" placeholder="검색 (제목·내용·인물·태그·메모)">
 <select id="view"><option value="tree" selected>세로보기</option><option value="act">가로보기</option><option value="char">인물별 보기</option><option value="table">표 보기</option></select>
 <select id="fa"><option value="">전체</option></select><button id="ffs">⭐ 중요만</button></div>
 <div class="row" id="tagbar"></div>
 <!-- 초기화 버튼 비활성화: <div class="row"><button id="rst">초기화</button></div> -->
</div>
<main id="list"></main>
<!-- 화면 하단에 고정된 소설 읽기 버튼: 문서 흐름을 차지하지 않음 -->
<button id="viewNovel" class="novel-fab" type="button">📖 소설내용보기</button>
<dialog id="dlg"><form method="dialog" id="f"></form></dialog>
<dialog id="adlg"><form method="dialog" id="af"><h3 style="margin:0">막 관리</h3><p class="pl">막 이름을 직접 수정하고, 순서를 바꾸거나 추가·삭제할 수 있습니다. 막을 삭제하면 해당 사건은 직전 막으로 이동합니다.</p><div id="actRows"></div><div class="row dacts"><button type="button" class="pill" id="actAdd">+ 막 추가</button><span style="flex:1"></span><button class="pill" value="ok">적용</button><button class="pill" value="cancel" formnovalidate>취소</button></div></form></dialog>
<dialog id="ndlg"><form method="dialog" id="nf"><div id="nhead"><h3 style="margin:0">📖 소설 내용 보기</h3><span id="nrole" class="rolechip"></span></div><p class="pl" id="nsum"></p><div class="nacts" id="nacts"></div><div id="neventnav" aria-label="막 안의 사건 바로가기"></div><div id="nbody"></div><div id="novelFloatActions"><button type="button" id="novelMenuToggle" aria-expanded="true">☰ 메뉴 접기</button><button type="button" id="nview"></button><button type="button" id="ncopy" title="지금 화면에 보이는 소설 글을 텍스트로 복사">📋 내용 복사</button><button type="button" id="nlink" title="다른 사람에게 보여줄 주소(URL)를 복사">🔗 링크 복사</button><button id="nclose" value="close" formnovalidate title="닫기">✕ 닫기</button></div></form><button type="button" id="novelScrollTop" class="novel-edge-scroll top" title="맨 위로">↑ 맨위로</button><button type="button" id="novelScrollBottom" class="novel-edge-scroll bottom" title="맨 아래로">↓ 맨아래로</button></dialog>

<script>
const ACTS=["프롤로그","1막","2막","3막","4막"];
const DEFTITLE="📖 소설 관리";
const RAW=[
["D-day","장소 A","프롤로그 이벤트","홍길동 이벤트 1의 요약을 입력하세요.","홍길동","",0,0],
["D-10","장소 B","첫 만남","홍길동과 임꺽정이 처음 만나는 이벤트입니다.","홍길동,임꺽정","검",1,1],
["D-5","장소 C","갈등","두 사람 사이에 갈등이 생깁니다.","홍길동,임꺽정","",2,0],
["D+1","장소 D","전환점","이야기의 전환점이 되는 이벤트입니다.","홍길동","",3,0],
["D+10","장소 E","결말","이야기가 마무리됩니다.","홍길동,임꺽정","",4,0]
];
const TR=[];
const SEEDE=RAW.map((r,i)=>({id:i+1,when:r[0],place:r[1],title:r[2],actual:"",chars:r[4],items:r[5],act:r[6],fs:!!r[7],memo:"",
 tags:[...TR.filter(t=>t[1].test(r[2]+r[3])).map(t=>t[0]),...(r[7]?["복선"]:[])].join(",")}));
const CH=[
["홍길동","주인공","성격을 입력하세요.","배경을 입력하세요.","변화(arc)를 입력하세요.","임꺽정의 친구","주인공"],
["임꺽정","조연","성격을 입력하세요.","배경을 입력하세요.","","홍길동의 친구","조연"]
];
const SEEDC=CH.map((r,i)=>({id:i+1,name:r[0],role:r[1],aliases:i==0?"길동":"",age:i==0?"27":"",look:"",personality:r[2],background:r[3],arc:r[4],relations:r[5],tags:r[6],memo:""}));
const SEEDI=[{id:1,name:"검",desc:"설명을 입력하세요.",owner:"임꺽정",memo:""}];
const arrOf=t=>t=="e"?D.events:t=="i"?D.items:D.chars;
const SCH={i:[["name","이름"],["desc","설명","ta"],["owner","소유자/관련 인물"],["memo","메모","ta"]],e:[["act","막","sel"],["when","시점 (D-100, D+ …)"],["place","장소"],["title","제목"],["actual","실제 내용 (소설 원문)","ta"],["chars","등장인물 (이름을 눌러 선택하거나 직접 입력 · 쉼표로 구분)"],["items","주요 아이템 (이름을 눌러 선택하거나 직접 입력 · 쉼표로 구분)"],["fs","⭐ 중요 표시","cb"],["done","☑ 작성 완료 (체크한 사건만 공유 링크에 보입니다)","cb"],["memo","작가 메모","ta"]],
 c:[["name","이름"],["aliases","이명 (다른 이름 · 쉼표로 구분, 예: 목사, 윤 집사)"],["role","역할"],["age","나이/학년"],["look","외모","ta"],["personality","성격","ta"],["background","배경","ta"],["arc","변화(arc)","ta"],["relations","관계","ta"],["memo","메모","ta"]]};
const KEY="novel-mgr-v2",$=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const split=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
const clone=x=>JSON.parse(JSON.stringify(x));
// 이 브라우저에 이미 저장된 데이터가 있었는지 (자동 불러오기 시 덮어쓰기 확인용)
// 공유 링크(?novel=1)로 열면 읽기 전용: 이 브라우저의 저장 데이터를 건드리지 않는다.
const SHARE=new URLSearchParams(location.search).has("novel");
if(SHARE)document.body.classList.add("share");
let HAD=false;try{HAD=!!localStorage.getItem(KEY)}catch(e){}
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.events){let v1;try{v1=JSON.parse(localStorage.getItem("novel-timeline-v1"))}catch(e){}
 D={events:Array.isArray(v1)?v1.map(e=>({tags:"",...e})):clone(SEEDE),chars:clone(SEEDC)}}
const save=()=>{if(SHARE)return;D.acts=clone(ACTS);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}if(window.fbHook)window.fbHook()};
let tab="tl",ft=new Set(),onlyFs=false,editing=null;
// 이전 버전에서 저장된 자동 태그를 한 번 제거한다.
if(!D._tagsRemoved){[...D.events,...D.chars].forEach(o=>o.tags="");D._tagsRemoved=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
// 막 이름 정규화: 객체 형태로 저장된 데이터도 문자열로 바꾼다. ([object Object] 방지)
// 객체가 문자열로 강제 변환되어 "[object Object]"로 표시되는 현상을 방지한다.
const safeText=(v,fallback="")=>{
 if(v==null)return fallback;
 if(typeof v==="string")return v;
 if(typeof v==="number"||typeof v==="boolean")return String(v);
 if(Array.isArray(v))return v.map(x=>safeText(x)).filter(Boolean).join(", ");
 if(typeof v==="object"){
  for(const k of ["name","title","label","text","value","displayName"]) {
   if(v[k]!=null && (typeof v[k]!=="object")) return String(v[k]);
  }
  try{return JSON.stringify(v)}catch(e){return fallback}
 }
 return fallback;
};
const actName=(a,i)=>safeText(a && typeof a==="object" ? (a.name??a.title??a.label??a.text) : a,`${i+1}막`)||`${i+1}막`;
const setActs=arr=>{ACTS.splice(0,ACTS.length,...arr.map((a,i)=>actName(a,i)))};
const normalizeData=()=>{
 if(!D||typeof D!=="object")D={events:[],chars:[]};
 if(!Array.isArray(D.events))D.events=[];
 if(!Array.isArray(D.chars))D.chars=[];
 if(!Array.isArray(D.items)){const seen=new Set();D.items=[];(D.events||[]).forEach(e=>String(e&&e.items||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!seen.has(n)){seen.add(n);D.items.push({id:D.items.length+1,name:n,desc:"",owner:"",memo:""})}}))}
 D.items=D.items.map((c,i)=>{if(!c||typeof c!=="object")c={name:safeText(c)};["name","desc","owner","memo"].forEach(k=>{c[k]=safeText(c[k],"")});c.id=Number(c.id)||i+1;return c});
 if(Array.isArray(D.acts)&&D.acts.length)setActs(D.acts);
 D.acts=clone(ACTS);
 if(typeof D.title!=="string")D.title=safeText(D.title,"");
 const eventFields=["when","place","title","actual","chars","items","tags","memo"];
 D.events=D.events.map((e,i)=>{
  if(!e||typeof e!=="object")e={title:safeText(e)};
  eventFields.forEach(k=>{e[k]=safeText(e[k],"")});
  e.id=Number(e.id)||i+1;
  e.act=Math.min(Math.max(0,Number(e.act)||0),ACTS.length-1);
  delete e.summary; // 요약 항목은 폐지됨
  e.fs=!!e.fs;e.done=!!e.done;
  return e;
 });
 const charFields=["name","aliases","role","age","look","personality","background","arc","relations","tags","memo"];
 D.chars=D.chars.map((c,i)=>{
  if(!c||typeof c!=="object")c={name:safeText(c)};
  charFields.forEach(k=>{c[k]=safeText(c[k],"")});
  c.id=Number(c.id)||i+1;
  return c;
 });
};
normalizeData();
save();
function fillActFilter(){const sel=$("fa"),v=sel.value;sel.innerHTML='<option value="">전체</option>'+ACTS.map((a,i)=>`<option value="${i}">${esc(a)}</option>`).join("");if([...sel.options].some(o=>o.value===v))sel.value=v}
fillActFilter();
// 이명(별칭): 인물의 다른 이름. 어느 이름으로 선택·조회해도 같은 인물로 취급한다.
const canon=n=>{const c=D.chars.find(x=>x.name===n||split(x.aliases).includes(n));return c?c.name:n};
const evHas=(e,name)=>split(e.chars).map(canon).includes(canon(name));
const aliasText=e=>split(e.chars).flatMap(n=>{const c=D.chars.find(x=>x.name===n||split(x.aliases).includes(n));return c?[c.name,...split(c.aliases)]:[]}).join(" ");
const aliasLbl=n=>{const c=D.chars.find(x=>x.name===n);return c&&split(c.aliases).length?`(${esc(split(c.aliases).join(", "))})`:""};
const hit=(o,q,ks)=>!q||ks.map(k=>o[k]).join(" ").toLowerCase().includes(q);
const tagOk=o=>[...ft].every(t=>split(o.tags).includes(t));

// 제목 편집
function applyTitle(){const t=$("ttl");if(document.activeElement!==t)t.textContent=D.title||DEFTITLE;document.title=(D.title||DEFTITLE).replace(/^📖\s*/,"")}
$("ttl").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();ev.target.blur()}});
$("ttl").addEventListener("blur",()=>{const v=$("ttl").textContent.replace(/\s+/g," ").trim();D.title=v||DEFTITLE;$("ttl").textContent=D.title;save();document.title=D.title.replace(/^📖\s*/,"")});
$("ttl").addEventListener("paste",ev=>{ev.preventDefault();document.execCommand("insertText",false,(ev.clipboardData.getData("text/plain")||"").replace(/\s+/g," "))});

// 공개된 사건 id 집합 (로그인 후 Firestore pubEvents 에서 실시간으로 채워진다)
let PUBMAP=new Map(),PUBGOT=false,PUBMETAS="";
const stIcons=e=>`<span class="st" data-donetog="${e.id}" title="${e.done?"작성 완료 (클릭하면 미완료로)":"작성 미완료 (클릭하면 완료로)"}">${e.done?"☑️":"☐"}</span>`;
// 요약 대신 소설 내용(실제 내용)의 첫머리를 한 줄로 보여준다.
const nvPrev=e=>{const t=String(e.actual||"").replace(/\s+/g," ").trim();return t?esc(t.length>50?t.slice(0,50)+"...":t):'<span class="pl">(소설 내용 없음)</span>'};
function evHTML(e,mini,drag){
 return `<div class="ev" data-eid="${e.id}"><div class="when">${esc(e.when)}<small>#${e.id}</small></div><div class="card ${e.fs?"fs":""} ${e.done?"done":""}">
 <div class="btns">${mini?stIcons(e):`${drag?`<button class="dh" data-i="${e.id}" title="드래그해서 다른 막/위치로 이동">⠿</button>`:""}${stIcons(e)}<button data-a="up" data-t="e" data-i="${e.id}">▲</button><button data-a="dn" data-t="e" data-i="${e.id}">▼</button><button data-a="del" data-t="e" data-i="${e.id}">✕</button>`}</div>
 <h3 class="clk" data-a="ed" data-t="e" data-i="${e.id}" title="클릭하면 수정">${e.fs?"⭐ ":""}${esc(e.title)}</h3><div class="pl">📍 ${esc(e.place)}</div><p class="clk onel" data-a="ed" data-t="e" data-i="${e.id}" title="클릭하면 수정">${nvPrev(e)}</p>${e.actual?`<button type="button" class="nvbtn" data-nv="${e.id}">📖 실제 소설 내용 보기</button>`:""}
 <div class="tags">${split(e.chars).map(c=>`<span class="nm" data-ch="${esc(c)}">👤 ${esc(c)}</span>`).join("")}${split(e.items).map(c=>`<span class="it" data-it="${esc(c)}" title="아이템 설정으로 이동">◇ ${esc(c)}</span>`).join("")}${split(e.tags).map(c=>`<span class="tg" data-tag="${esc(c)}">#${esc(c)}</span>`).join("")}</div>
 ${e.memo?`<div class="memo">📝 ${esc(e.memo)}</div>`:""}</div></div>`}
function chHTML(c){
 const n=D.events.filter(e=>evHas(e,c.name)).length;
 const kv=(k,l)=>c[k]?`<div class="kv"><b>${l}</b>${esc(c[k])}</div>`:"";
 return `<div class="card"><div class="btns"><button data-a="del" data-t="c" data-i="${c.id}">✕</button></div>
 <h3 class="clk" data-a="ed" data-t="c" data-i="${c.id}" title="클릭하면 수정">${esc(c.name)}${aliasLbl(c.name)} <span class="pl">${esc(c.role)}${c.age?" · "+esc(c.age):""}</span></h3>
 ${kv("look","외모")}${kv("personality","성격")}${kv("background","배경")}${kv("arc","변화")}${kv("relations","관계")}
 <div class="kv"><b>등장</b><a href="#" data-showch="${esc(c.name)}">타임라인 ${n}건 보기</a></div>
 <div class="tags">${split(c.tags).map(t=>`<span class="tg" data-tag="${esc(t)}">#${esc(t)}</span>`).join("")}</div>
 ${c.memo?`<div class="memo">📝 ${esc(c.memo)}</div>`:""}</div>`}
function itHTML(c){
 const n=D.events.filter(e=>split(e.items).includes(c.name)).length;
 const kv=(k,l)=>c[k]?`<div class="kv"><b>${l}</b>${esc(c[k])}</div>`:"";
 const own=split(c.owner).map(nm=>D.chars.some(x=>x.name===nm)?`<a href="#" data-ch="${esc(nm)}">${esc(nm)}</a>`:esc(nm)).join(", ");
 return `<div class="card"><div class="btns"><button data-a="del" data-t="i" data-i="${c.id}">✕</button></div>
 <h3 class="clk" data-a="ed" data-t="i" data-i="${c.id}" title="클릭하면 수정">◇ ${esc(c.name)}</h3>${kv("desc","설명")}${c.owner?`<div class="kv"><b>관련 인물</b>${own}</div>`:""}
 <div class="kv"><b>등장</b><a href="#" data-showit="${esc(c.name)}">타임라인 ${n}건 보기</a></div>
 ${c.memo?`<div class="memo">📝 ${esc(c.memo)}</div>`:""}</div>`}
function render(){
 const q=$("q").value.toLowerCase(),fa=$("fa").value,v=$("view").value;
 const tags=[...new Set([...D.events,...D.chars].flatMap(o=>split(o.tags)))].sort();
 $("tagbar").innerHTML=tags.map(t=>`<button class="chip ${ft.has(t)?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")||"<span class='pl'>태그 없음</span>";
 $("view").hidden=$("fa").hidden=$("ffs").hidden=tab!="tl";
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab==tab));
 document.body.classList.toggle("treeview",tab=="tl"&&v=="tree");
 applyTitle();
 const oldWrap=document.querySelector(".tree-wrap"),sl=oldWrap?oldWrap.scrollLeft:0,st=oldWrap?oldWrap.scrollTop:0;
 let h="";
 $("add").textContent=tab=="ac"?"+ 막 추가":"+ 추가";
 if(tab=="ac"){
  h=`<div class="aclist">${ACTS.map((a,i)=>`<div class="acrow card"><button data-aact="up" data-ai="${i}" ${i===0?"disabled":""}>▲</button><button data-aact="dn" data-ai="${i}" ${i===ACTS.length-1?"disabled":""}>▼</button><button data-aact="del" data-ai="${i}">✕</button><input data-an="${i}" value="${esc(a)}"><span class="pl">${D.events.filter(e=>+e.act===i&&e.done).length}/${D.events.filter(e=>+e.act===i).length}개</span></div>`).join("")}</div>`;
  $("stat").textContent=`막 ${ACTS.length}개`;
 }else if(tab=="it"){
  const L=D.items.filter(c=>hit(c,q,["name","desc","owner","memo"]));
  h=`<div class="grid">${L.map(itHTML).join("")}</div>`;
  $("stat").textContent=`아이템 ${D.items.length}개 · 표시 ${L.length}`;

let drag=null;
function clearMarks(){document.querySelectorAll(".dbefore,.dafter,.dcol").forEach(el=>el.classList.remove("dbefore","dafter","dcol"))}
function moveEvent(id,t){
 const arr=D.events,i=arr.findIndex(x=>x.id===id);if(i<0)return;
 const [e]=arr.splice(i,1);e.act=t.act;let at;
 if(t.ref!=null){const j=arr.findIndex(x=>x.id===t.ref);at=j<0?arr.length:(t.before?j:j+1)}
 else{let last=-1;arr.forEach((x,k)=>{if(+x.act<=t.act)last=k});at=last+1}
 arr.splice(at,0,e);
}
document.addEventListener("pointerdown",ev=>{
 const h=ev.target.closest(".dh");if(!h||drag)return;
 ev.preventDefault();
 const evEl=h.closest(".ev"),card=evEl.querySelector(".card"),r=card.getBoundingClientRect();
 const ghost=card.cloneNode(true);ghost.classList.add("ghost");
 ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;max-height:240px;overflow:hidden;pointer-events:none;opacity:.88;z-index:200;transform:rotate(1.5deg)`;
 document.body.appendChild(ghost);evEl.classList.add("dragging");
 drag={id:+h.dataset.i,ghost,evEl,dx:ev.clientX-r.left,dy:ev.clientY-r.top,target:null,pid:ev.pointerId,el:h};
 try{h.setPointerCapture(ev.pointerId)}catch(e){}
});
document.addEventListener("pointermove",ev=>{
 if(!drag||ev.pointerId!==drag.pid)return;
 ev.preventDefault();
 drag.ghost.style.left=(ev.clientX-drag.dx)+"px";drag.ghost.style.top=(ev.clientY-drag.dy)+"px";
 const wrap=document.querySelector(".tree-wrap");
 if(wrap){const wr=wrap.getBoundingClientRect(),m=60;
  if(ev.clientX>wr.right-m)wrap.scrollLeft+=18;else if(ev.clientX<wr.left+m)wrap.scrollLeft-=18;
  if(ev.clientY>wr.bottom-m)wrap.scrollTop+=18;else if(ev.clientY<wr.top+m)wrap.scrollTop-=18;}
 clearMarks();drag.target=null;
 const el=document.elementFromPoint(ev.clientX,ev.clientY);if(!el)return;
 const col=el.closest(".tree-act");if(!col)return;
 const act=+col.dataset.act;
 let node=el.closest(".tree-node"),after=false;
 const ins=el.closest(".tree-insert");
 if(!node&&ins){node=ins.previousElementSibling;after=true}
 if(node&&+node.dataset.id!==drag.id){
  if(!after){const nr=node.getBoundingClientRect();after=ev.clientY>nr.top+nr.height/2}
  drag.target={act,ref:+node.dataset.id,before:!after};
  node.classList.add(after?"dafter":"dbefore");
 }else if(!node){drag.target={act,ref:null};col.classList.add("dcol")}
});
function endDrag(ev,cancel){
 if(!drag||(ev&&ev.pointerId!==drag.pid))return;
 const d=drag;drag=null;
 d.ghost.remove();d.evEl.classList.remove("dragging");clearMarks();
 try{d.el.releasePointerCapture(d.pid)}catch(e){}
 if(!cancel&&d.target){moveEvent(d.id,d.target);save();render()}
}

 fbUnlisten();const {db,fs}=FB;
 const onErr=e=>{fbErr=fbErrText(e);fbStatus()};
 COLS.forEach(k=>fbUnsub.push(fs.onSnapshot(fs.collection(db,k),{includeMetadataChanges:true},s=>{SNAP[k]=s;fbGot.add(k);fbOnSnap()},onErr)));
 fbUnsub.push(fs.onSnapshot(fs.doc(db,"meta","main"),{includeMetadataChanges:true},s=>{SNAP.meta=s;fbGot.add("meta");fbOnSnap()},onErr));
 // 공개 상태(어떤 사건이 공개되어 있는지)를 실시간으로 반영한다.
 fbUnsub.push(fs.onSnapshot(fs.collection(db,"pubEvents"),s=>{PUBMAP=new Map(s.docs.map(d=>[d.id,stable(d.data())]));PUBGOT=true;if(!fbTimer)fbSyncPub()},()=>{}));
}
function fbUnlisten(){fbUnsub.forEach(f=>{try{f()}catch(e){}});fbUnsub=[];SNAP={};fbGot=new Set();fbBased=false;fbAsked=false;BASE=new Map();PUBMAP=new Map();PUBGOT=false;PUBMETAS=""}
async function fbLogin(){
 const {au,auth}=FB,provider=new au.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
 try{await au.signInWithPopup(auth,provider)}
 catch(e){
  const c=e&&e.code||"";
  if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"){try{await au.signInWithRedirect(auth,provider)}catch(e2){alert("로그인 실패: "+(e2.message||e2))}}
  else if(c==="auth/unauthorized-domain")alert("이 주소가 Firebase에 등록되지 않았습니다.\nFirebase 콘솔 → Authentication → 설정 → 승인된 도메인에\n"+location.hostname+" 을(를) 추가하세요.");
  else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")alert("로그인 실패: "+(e.message||c));
 }
}
// 공유 링크: 작성 완료(☑)로 체크된 사건만 pubEvents 에 사본을 두고, 내용이 바뀌면 자동으로 다시 올린다.
function fbSyncPub(){
 if(SHARE||!FB||!fbUser||!fbBased||!PUBGOT)return;
 const {db,fs}=FB,want=new Map(),ops=[];
  D.events.forEach((e,i)=>{if(e.done&&String(e.actual||"").trim())want.set(String(e.id),{id:e.id,act:+e.act||0,title:e.title||"",actual:String(e.actual),ord:i})});
 want.forEach((d,id)=>{if(PUBMAP.get(id)!==stable(d))ops.push({t:"s",ref:fs.doc(db,"pubEvents",id),data:d})});
 PUBMAP.forEach((v,id)=>{if(!want.has(id))ops.push({t:"d",ref:fs.doc(db,"pubEvents",id)})});
 const meta={title:D.title||"",acts:ACTS.slice()},ms=want.size?stable(meta):"";
 if(want.size&&ms!==PUBMETAS)ops.push({t:"s",ref:fs.doc(db,"pubMeta","main"),data:{...meta,updatedAt:Date.now()}});
 if(!want.size&&PUBMAP.size)ops.push({t:"d",ref:fs.doc(db,"pubMeta","main")});
 if(!ops.length)return;
 PUBMETAS=ms;
 want.forEach((d,id)=>PUBMAP.set(id,stable(d)));[...PUBMAP.keys()].forEach(id=>{if(!want.has(id))PUBMAP.delete(id)});
 for(let i=0;i<ops.length;i+=400){const wb=fs.writeBatch(db);ops.slice(i,i+400).forEach(o=>o.t==="s"?wb.set(o.ref,o.data):wb.delete(o.ref));wb.commit().catch(e=>{PUBGOT=false;fbErr="공개 반영 실패: "+fbErrText(e);fbStatus()})}
}
async function fbStart(){
 // GitHub 관련 기능과 초기화 버튼은 제거했습니다. 서버 데이터는 구글 로그인 후 Firestore에서만 읽습니다.
 // 초기화 버튼 요소(rst)는 HTML에서 주석 처리되어 있으므로 접근하지 않습니다.
 fbStatus();
 try{await fbInit(true)}catch(e){fbErr="Firebase를 불러오지 못했습니다 (인터넷 확인)";fbStatus();return}
 $("fbst").onclick=async()=>{if(fbUser){if(confirm(`${fbUser.email||"계정"} 에서 로그아웃할까요?\n(이 기기의 데이터는 그대로 남고, 서버 동기화만 멈춥니다.)`))await FB.au.signOut(FB.auth)}else await fbLogin()};
 window.addEventListener("online",fbStatus);window.addEventListener("offline",fbStatus);
 window.addEventListener("beforeunload",ev=>{if(fbTimer){ev.preventDefault();ev.returnValue=""}});
 FB.au.onAuthStateChanged(FB.auth,u=>{
  fbUser=u;fbErr="";
  if(u){fbListen()}
  else{
   fbUnlisten();
   // 로그아웃하면 서버/개인 데이터 대신 더미 화면으로 되돌립니다.
   if(!SHARE){D=makeDummyData();normalizeData();fillActFilter();render();cacheLocal()}
  }
  fbStatus();
 });
}
// 공유 링크: 로그인 없이 공개 사본(pubMeta / pubEvents)만 읽는다.
async function fbShare(){
 ldShow("소설 불러오는 중…");
 try{
  await fbInit(false);const {db,fs}=FB;
  const [m,es]=await Promise.all([fs.getDoc(fs.doc(db,"pubMeta","main")),fs.getDocs(fs.collection(db,"pubEvents"))]);
  if(!m.exists()&&es.empty){shareFail("아직 공개된 내용이 없습니다.");return}
  const mm=m.exists()?m.data():{};
  const evs=es.docs.map(d=>d.data()).sort((a,b)=>(a.ord??0)-(b.ord??0)).map(({ord,...r})=>r);
  D={title:mm.title||"",acts:Array.isArray(mm.acts)?mm.acts:[],events:evs,chars:[],items:[]};
  normalizeData();fillActFilter();ldHide();
 }catch(e){shareFail("소설 데이터를 불러오지 못했습니다. ("+fbErrText(e)+")");return}
 shareShow();
}
// 공유 링크는 편집 화면을 렌더링하지 않고, 서버에서 공개된 소설만 불러옵니다.
// 이 분기를 먼저 처리해 공유 모드에서 일반 화면의 렌더링 오류가 발생해도
// 공유 소설을 불러오는 작업까지 막히지 않게 합니다.
if(SHARE){
 normalizeData();
 fillActFilter();
 if(FBON)fbShare();
 else shareLoad();
}else{
 // 일반 화면은 항상 더미 데이터로 시작합니다. 로그인 성공 후에만 Firestore 데이터로 교체됩니다.
 if(FBON){D=makeDummyData();normalizeData();fillActFilter()}
 render();
 if(FBON)fbStart();
}
</script>
